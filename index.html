let equivXMLRows=[];
let equivXMLMeta={};

function handleEquivXMLDrop(e){
  const file=e.dataTransfer.files[0];if(file)processEquivXML(file);
}
function handleEquivXML(input){
  const file=input.files[0];if(file)processEquivXML(file);
}

function processEquivXML(file){
  const status=document.getElementById('equiv-xml-status');
  const btn=document.getElementById('equiv-btn-map');
  if(status)status.textContent='Leyendo '+file.name+'...';
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const parser=new DOMParser();
      const xmlDoc=parser.parseFromString(e.target.result,'text/xml');
      if(xmlDoc.querySelector('parsererror')){
        if(status)status.textContent='❌ XML inválido';return;
      }
      equivXMLRows=[];equivXMLMeta={};

      // Detect CFDI
      const root=xmlDoc.documentElement;
      const isCFDI=root.getAttribute('xmlns:cfdi')!=null||
                   root.tagName.includes('Comprobante')||
                   xmlDoc.querySelector('cfdi\\:Conceptos,Conceptos')!=null;

      if(isCFDI){
        const emisorEl=xmlDoc.querySelector('cfdi\\:Emisor,Emisor');
        equivXMLMeta={
          tipo:'CFDI',
          emisor:emisorEl?.getAttribute('Nombre')||emisorEl?.getAttribute('nombre')||'Proveedor',
          rfc:emisorEl?.getAttribute('Rfc')||emisorEl?.getAttribute('rfc')||'',
          fecha:(root.getAttribute('Fecha')||root.getAttribute('fecha')||'').slice(0,10),
          folio:root.getAttribute('Folio')||root.getAttribute('folio')||'',
        };
        const conceptos=xmlDoc.querySelectorAll('cfdi\\:Concepto,Concepto');
        conceptos.forEach(c=>{
          const desc=c.getAttribute('Descripcion')||c.getAttribute('descripcion')||c.getAttribute('Description')||'';
          const codigo=c.getAttribute('NoIdentificacion')||c.getAttribute('noIdentificacion')||c.getAttribute('ClaveProdServ')||'';
          const qty=c.getAttribute('Cantidad')||c.getAttribute('cantidad')||'1';
          const precio=c.getAttribute('ValorUnitario')||c.getAttribute('valorUnitario')||'0';
          // Extract tasa IVA
          const traslado=c.querySelector('cfdi\\:Traslado,Traslado');
          const tasaRaw=traslado?.getAttribute('TasaOCuota')||traslado?.getAttribute('tasaOCuota');
          const tasa=tasaRaw!==null&&tasaRaw!==undefined?parseFloat(tasaRaw):null;
          // Auto-match via EQUIV_DB
          const existingSku=findEquiv(codigo,desc);
          const autoMatch=PRODS.find(p=>p.sku===existingSku)||
                          PRODS.find(p=>p.name.toLowerCase()===desc.toLowerCase())||
                          PRODS.find(p=>p.sku===codigo);
          equivXMLRows.push({desc,codigo,qty,precio,tasa,
            sku:autoMatch?.sku||existingSku||'',
            yaEquivalencia:!!existingSku,
            nuevo:!existingSku
          });
        });
      } else {
        // Generic XML
        equivXMLMeta={tipo:'XML genérico'};
        const tagCounts={};
        const countTags=el=>Array.from(el.children).forEach(c=>{tagCounts[c.tagName]=(tagCounts[c.tagName]||0)+1;countTags(c)});
        countTags(root);
        const itemTag=Object.entries(tagCounts).sort((a,b)=>b[1]-a[1])[0]?.[0]||'item';
        const items=xmlDoc.querySelectorAll(itemTag);
        items.forEach(item=>{
          const get=names=>{for(const n of names){const v=item.getAttribute(n)||item.querySelector(n)?.textContent;if(v)return v;}return ''};
          const desc=get(['descripcion','Descripcion','description','Description','nombre','Nombre','name']);
          const codigo=get(['noIdentificacion','NoIdentificacion','id','sku','SKU','codigo','Codigo','code','Code','clave']);
          const qty=get(['cantidad','Cantidad','quantity','qty'])||'1';
          const precio=get(['precioUnitario','PrecioUnitario','valorUnitario','ValorUnitario','precio','price'])||'0';
          const existingSku=findEquiv(codigo,desc);
          const autoMatch=PRODS.find(p=>p.sku===existingSku)||PRODS.find(p=>p.name.toLowerCase()===desc.toLowerCase());
          equivXMLRows.push({desc,codigo,qty,precio,
            sku:autoMatch?.sku||existingSku||'',
            yaEquivalencia:!!existingSku,nuevo:!existingSku
          });
        });
      }

      if(equivXMLRows.length===0){if(status)status.textContent='❌ No se encontraron conceptos en el XML';return}
      const nuevos=equivXMLRows.filter(r=>r.nuevo).length;
      const yaMap=equivXMLRows.filter(r=>r.yaEquivalencia).length;
      if(status)status.textContent=`✅ ${equivXMLMeta.tipo} — ${equivXMLRows.length} concepto(s): ${yaMap} ya mapeados, ${nuevos} nuevos — ${file.name}`;
      if(btn){btn.style.opacity='1';btn.style.pointerEvents='auto';}
    }catch(err){if(status)status.textContent='❌ Error: '+err.message;}
  };
  reader.readAsText(file,'UTF-8');
}

  const metaBar=`<div style="background:var(--bg2);border-radius:var(--r);padding:10px 14px;font-size:12px;margin-bottom:14px;display:flex;gap:14px;flex-wrap:wrap">

    ${equivXMLMeta.fecha?`<span>📅 ${equivXMLMeta.fecha}</span>`:''}
    ${equivXMLMeta.folio?`<span>🔖 ${equivXMLMeta.folio}</span>`:''}
  </div>`;

  const nuevos=equivXMLRows.filter(r=>r.nuevo).length;
  // SKUs already assigned globally (except ones assigned in THIS batch)

  const rows=equivXMLRows.map((r,i)=>{

      disponibles.map(p=>`<option value="${p.sku}" ${p.sku===r.sku?'selected':''}>${p.sku} — ${p.name}</option>`).join('');

    <div class="ma">

function validateEquivMapperSel(idx, sel){
  const sku=sel.value;
  equivXMLRows[idx].sku=sku;
  if(!sku) return;
  // Check duplicate within batch
  const dupBatch=equivXMLRows.findIndex((r,i)=>i!==idx&&r.sku===sku);
  if(dupBatch>=0){
    const p=PRODS.find(x=>x.sku===sku);
    toast(`⚠️ ${p?.name||sku} ya fue asignado al concepto ${dupBatch+1}. Un SKU solo puede usarse una vez.`);
    sel.value='';equivXMLRows[idx].sku='';return;
  }
  // Check duplicate in DB (different key)
  const key=equivXMLRows[idx].codigo||('DESC::'+equivXMLRows[idx].desc.toLowerCase().trim());
  const dupDB=Object.entries(EQUIV_DB).find(([k,v])=>v.sku===sku&&k!==key);
  if(dupDB){
    const p=PRODS.find(x=>x.sku===sku);
    const keyLabel=dupDB[0].startsWith('DESC::')?dupDB[0].slice(6):dupDB[0];
    toast(`⚠️ ${p?.name||sku} ya tiene equivalencia con "${keyLabel}". Se sobreescribirá al guardar.`);
  }
}

function saveEquivFromXML(){
  let guardadas=0;let actualizadas=0;let rechazadas=0;
  const skusEnBatch={};
  const errores=[];
  equivXMLRows.forEach((r,i)=>{
    const key=r.codigo||('DESC::'+r.desc.toLowerCase().trim());
    if(r.sku){
      // Restriction: SKU already used in DB by a DIFFERENT key
      const dupDB=Object.entries(EQUIV_DB).find(([k,v])=>v.sku===r.sku&&k!==key);
      if(dupDB){
        const keyLabel=dupDB[0].startsWith('DESC::')?dupDB[0].slice(6):dupDB[0];
        const p=PRODS.find(x=>x.sku===r.sku);
        errores.push(`${p?.name||r.sku}: ya asignado a "${keyLabel}"`);
        rechazadas++;
        // Still save without SKU so it appears in the table
        if(!EQUIV_DB[key]){
          EQUIV_DB[key]={sku:'',descripcionXML:r.desc,asignadoEn:ds(),tasa:r.tasa};
          guardadas++;
        }
        return;
      }
      // Restriction: SKU used twice in this batch
      if(skusEnBatch[r.sku]&&skusEnBatch[r.sku]!==key){
        const p=PRODS.find(x=>x.sku===r.sku);
        errores.push(`${p?.name||r.sku}: asignado a dos conceptos en este XML`);
        rechazadas++;
        if(!EQUIV_DB[key]){
          EQUIV_DB[key]={sku:'',descripcionXML:r.desc,asignadoEn:ds(),tasa:r.tasa};
          guardadas++;
        }
        return;
      }
      skusEnBatch[r.sku]=key;
    }
    // Save all — with or without SKU
    const eraExistente=!!EQUIV_DB[key];
    saveEquiv(r.codigo,r.desc,r.sku||'',r.tasa);
    if(eraExistente)actualizadas++;else guardadas++;
  });
  addLog('equivalencias','Importación XML',`Equivalencias: ${guardadas} nuevas, ${actualizadas} actualizadas, ${rechazadas} rechazadas`);
  closeMod();rPage('equivalencias');
  if(errores.length>0){
    setTimeout(()=>alert(`⚠️ ${rechazadas} equivalencia(s) rechazada(s) por duplicado:\n\n${errores.join('\n')}`),300);
  }
  toast(`Equivalencias: ${guardadas} guardadas, ${actualizadas} actualizadas${rechazadas?`, ${rechazadas} rechazadas`:''}`);
}

function clearAllEquiv(){
  const n=Object.keys(EQUIV_DB).length;
  if(n===0){toast('No hay equivalencias que borrar');return}
  if(!confirm(`⚠️ ¿Seguro que quieres eliminar las ${n} equivalencias guardadas? Esta acción no se puede deshacer.`)) return;
  EQUIV_DB={};
  saveEquivDB();
  rPage('equivalencias');
  toast(`${n} equivalencias eliminadas permanentemente`);
}

function exportEquiv(){
  const rows=Object.entries(EQUIV_DB).map(([k,v])=>
    [k.startsWith('DESC::')?'':k, v.descripcionXML||'', v.sku||'', v.asignadoEn||'']
  );
  const csv=['Código XML,Descripción XML,SKU,Fecha asignación',...rows.map(r=>r.map(v=>`"${v}"`).join(','))].join('\r\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='equivalencias_xml.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Equivalencias exportadas');
}

function handleXMLDrop(e){
  const file=e.dataTransfer.files[0];
  if(file) processXMLFile(file);
}
function handleXMLFile(input){
  const file=input.files[0];
  if(file) processXMLFile(file);
}

let xmlParsedRows=[];
let xmlMeta={};

function processXMLFile(file){
  const status=document.getElementById('xml-status');
  const btn=document.getElementById('xml-btn-preview');
  if(status) status.textContent='Leyendo '+file.name+'...';
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const parser=new DOMParser();
      const xmlDoc=parser.parseFromString(e.target.result,'text/xml');
      const parseErr=xmlDoc.querySelector('parsererror');
      if(parseErr){if(status)status.textContent='❌ El archivo no es un XML válido.';return;}

      // Detect format
      const isCFDI=xmlDoc.querySelector('[name="cfdi:Comprobante"],[name="Comprobante"]')||
                   xmlDoc.documentElement.tagName.toLowerCase().includes('comprobante')||
                   xmlDoc.documentElement.getAttribute('xmlns:cfdi')!=null||
                   xmlDoc.documentElement.tagName==='cfdi:Comprobante'||
                   xmlDoc.querySelector('cfdi\\:Conceptos,Conceptos')!=null;

      if(isCFDI){
        parseCFDI(xmlDoc);
      } else {
        parseGenericXML(xmlDoc);
      }

      if(xmlParsedRows.length===0){
        if(status)status.textContent='❌ No se encontraron productos/conceptos en el XML.';return;
      }
      if(status)status.textContent=`✅ ${xmlMeta.tipo||'XML'} detectado — ${xmlParsedRows.length} concepto(s) encontrado(s) — ${file.name}`;
      if(btn){btn.style.opacity='1';btn.style.pointerEvents='auto';}
    } catch(err){
      if(status)status.textContent='❌ Error al procesar el XML: '+err.message;
    }
  };
  reader.readAsText(file,'UTF-8');
}

function parseCFDI(xmlDoc){
  xmlParsedRows=[];
  // Try both namespaced and non-namespaced selectors
  const root=xmlDoc.documentElement;
  const ns=root.getAttribute('xmlns:cfdi')||'';

  // Header info
  const fecha=root.getAttribute('Fecha')||root.getAttribute('fecha')||ds();
  const emisorEl=xmlDoc.querySelector('cfdi\\:Emisor,Emisor');
  const emisor=emisorEl?.getAttribute('Nombre')||emisorEl?.getAttribute('nombre')||'Proveedor';
  const total=root.getAttribute('Total')||root.getAttribute('total')||'';
  const folio=root.getAttribute('Folio')||root.getAttribute('folio')||root.getAttribute('Serie')||'';
  xmlMeta={tipo:'CFDI (Factura electrónica)',fecha:fecha.slice(0,10),emisor,total,folio};

  // Get conceptos
  const conceptos=xmlDoc.querySelectorAll('cfdi\\:Concepto,Concepto');
  conceptos.forEach(c=>{
    const desc=c.getAttribute('Descripcion')||c.getAttribute('descripcion')||c.getAttribute('Description')||'Sin descripción';
    const qty=parseFloat(c.getAttribute('Cantidad')||c.getAttribute('cantidad')||'1');
    const unitPrice=parseFloat(c.getAttribute('ValorUnitario')||c.getAttribute('valorUnitario')||c.getAttribute('PrecioUnitario')||'0');
    const importe=parseFloat(c.getAttribute('Importe')||c.getAttribute('importe')||'0');
    const clave=c.getAttribute('ClaveProdServ')||c.getAttribute('claveProdServ')||'';
    const noId=c.getAttribute('NoIdentificacion')||c.getAttribute('noIdentificacion')||'';

    // Extract tasa IVA from nested cfdi:Traslado
    const traslado=c.querySelector('cfdi\\:Traslado,Traslado');
    const tasaRaw=traslado?.getAttribute('TasaOCuota')||traslado?.getAttribute('tasaOCuota')||'0';
    const tasa=parseFloat(tasaRaw);
    const tasaLabel=tasa>0?`${(tasa*100).toFixed(0)}%`:'Exento';

    // 1. Check EQUIV_DB first (user-defined mappings)
    const equivSku=findEquiv(noId,desc);
    // 2. Fallback to name match
    const namMatch=!equivSku&&PRODS.find(p=>
      p.sku===noId||
      p.name.toLowerCase()===desc.toLowerCase()||
      p.name.toLowerCase().includes(desc.toLowerCase().slice(0,10))
    );
    const finalSku=equivSku||namMatch?.sku||noId||'';
    const prod=PRODS.find(p=>p.sku===finalSku);

    // Register in EQUIV_DB if new code — include tasa
    if((noId||desc)&&!EQUIV_DB[noId||('DESC::'+desc.toLowerCase().trim())]){
      saveEquiv(noId,desc,finalSku,tasa);
    } else if(noId||desc){
      // Update tasa if entry exists but tasa not set
      const key=noId||('DESC::'+desc.toLowerCase().trim());
      if(EQUIV_DB[key]&&EQUIV_DB[key].tasa===undefined){
        EQUIV_DB[key].tasa=tasa;
        saveEquivDB();
      }
    }

    xmlParsedRows.push({
      desc,qty,unitPrice,importe,clave,noId,tasa,tasaLabel,
      sku:finalSku,
      matchedName:prod?.name||'',
      matched:!!prod,
      autoMapped:!!equivSku
    });
  });
}

function parseGenericXML(xmlDoc){
  xmlParsedRows=[];
  xmlMeta={tipo:'XML genérico'};
  const root=xmlDoc.documentElement;

  // Look for repeating child elements that look like line items
  const children=Array.from(root.children);
  // Find the element with the most repeated tag (likely the items container)
  const tagCounts={};
  function countTags(el){
    Array.from(el.children).forEach(c=>{
      tagCounts[c.tagName]=(tagCounts[c.tagName]||0)+1;
      countTags(c);
    });
  }
  countTags(root);
  const itemTag=Object.entries(tagCounts).sort((a,b)=>b[1]-a[1])[0]?.[0];

  const items=xmlDoc.querySelectorAll(itemTag||'item,Item,producto,Producto,concepto,Concepto,linea,Linea');
  if(items.length===0){
    // Fallback: try all leaf-level repeated elements
    const allEls=Array.from(xmlDoc.querySelectorAll('*'));
    const candidates=allEls.filter(el=>el.children.length===0&&el.textContent.trim());
    xmlMeta.tipo='XML genérico (estructura plana)';
    // Just show all attributes of root children
    Array.from(root.children).forEach(child=>{
      const attrs={};
      Array.from(child.attributes).forEach(a=>attrs[a.name]=a.value);
      const text=child.textContent.trim();
      if(Object.keys(attrs).length>0||text){
        xmlParsedRows.push({desc:child.tagName+': '+text,qty:1,unitPrice:0,importe:0,sku:'',matched:false,noId:'',attrs});
      }
    });
    return;
  }

  items.forEach(item=>{
    // Try common field names
    const getAttrOrChild=(names)=>{
      for(const n of names){
        const v=item.getAttribute(n)||item.querySelector(n)?.textContent;
        if(v) return v;
      }
      return '';
    };
    const desc=getAttrOrChild(['descripcion','Descripcion','description','Description','nombre','Nombre','name','Name','concepto','Concepto']);
    const qty=parseFloat(getAttrOrChild(['cantidad','Cantidad','quantity','Quantity','qty','Qty'])||'1');
    const unitPrice=parseFloat(getAttrOrChild(['precioUnitario','PrecioUnitario','valorUnitario','ValorUnitario','precio','Precio','price','Price','unitPrice'])||'0');
    const importe=parseFloat(getAttrOrChild(['importe','Importe','total','Total','subtotal','Subtotal'])||'0')||qty*unitPrice;
    const noId=getAttrOrChild(['noIdentificacion','NoIdentificacion','id','Id','sku','SKU','codigo','Codigo','code','Code']);
    const equivSkuG=findEquiv(noId,desc);
    const nameMatchG=!equivSkuG&&PRODS.find(p=>p.sku===noId||p.name.toLowerCase().includes((desc||'').toLowerCase().slice(0,8)));
    const finalSkuG=equivSkuG||nameMatchG?.sku||noId||'';
    const prodG=PRODS.find(p=>p.sku===finalSkuG);
    if((noId||desc)&&!EQUIV_DB[noId||('DESC::'+desc.toLowerCase().trim())]){
      saveEquiv(noId,desc,finalSkuG);
    }
    xmlParsedRows.push({desc:desc||item.tagName,qty,unitPrice,importe,sku:finalSkuG,matchedName:prodG?.name||'',matched:!!prodG,noId,autoMapped:!!equivSkuG});
  });
}

function removeXMLRow(i){
  xmlParsedRows.splice(i,1);
  const m=document.querySelector('.md');
  renderXMLPreview(m);
}

function addXMLRowManual(){
  const sku=document.getElementById('xml-add-sku')?.value;
  const qty=Number(document.getElementById('xml-add-qty')?.value||1);
  if(!sku){toast('Selecciona un SKU');return}
  const p=PRODS.find(x=>x.sku==sku);
  // Check duplicate SKU in batch
  const dup=xmlParsedRows.findIndex(r=>String(r.sku)===String(sku));
  if(dup>=0){toast(`⚠️ ${p?.name||sku} ya está en la lista (fila ${dup+1})`);return}
  xmlParsedRows.push({
    desc:p?.name||sku,qty,unitPrice:0,importe:0,
    sku:String(sku),matchedName:p?.name||'',matched:!!p,
    noId:'',autoMapped:false,tasa:null,manual:true
  });
  const m=document.querySelector('.md');
  renderXMLPreview(m);
  toast(`${p?.name||sku} agregado`);
}

function updateXMLRow(i,sku){
  if(!sku){xmlParsedRows[i].sku='';xmlParsedRows[i].matched=false;return;}
  // Restriction: SKU already used in another row of this XML?
  const dupRow=xmlParsedRows.findIndex((r,idx)=>idx!==i&&r.sku===sku);
  if(dupRow>=0){
    const p=PRODS.find(x=>x.sku===sku);
    toast(`⚠️ ${p?.name||sku} ya fue asignado al concepto ${dupRow+1}. Un SKU solo puede asignarse una vez.`);
    document.getElementById('xsku-'+i).value=xmlParsedRows[i].sku||'';
    return;
  }
  // Restriction: SKU already assigned to a DIFFERENT equivalencia key in DB?
  const key=xmlParsedRows[i].noId||('DESC::'+xmlParsedRows[i].desc.toLowerCase().trim());
  const dupDB=Object.entries(EQUIV_DB).find(([k,v])=>v.sku===sku&&k!==key);
  if(dupDB){
    const p=PRODS.find(x=>x.sku===sku);
    const keyLabel=dupDB[0].startsWith('DESC::')?dupDB[0].slice(6):dupDB[0];
    toast(`⚠️ ${p?.name||sku} ya tiene equivalencia con "${keyLabel}". Al confirmar se actualizará esa equivalencia.`);
  }
  xmlParsedRows[i].sku=sku;
  xmlParsedRows[i].matched=!!PRODS.find(x=>x.sku===sku);
  xmlParsedRows[i].matchedName=PRODS.find(x=>x.sku===sku)?.name||'';
}

function eliminarFactura(fac){
  if(!confirm(`¿Eliminar TODOS los registros de la factura "${fac}"?\n\nEsta acción no se puede deshacer.`))return;
  const d=ensD();
  const antes=d.compras.length;
  d.compras=d.compras.filter(r=>(r.factura||'Sin factura')!==fac);
  const eliminados=antes-d.compras.length;
  saveDD();
  addLog('compras','Factura eliminada',`Factura ${fac} eliminada — ${eliminados} registros`);
  rPage('compras');
  toast(`✓ Factura ${fac} eliminada — ${eliminados} registros borrados`);
}

function confirmXMLImport(){
  const d=ensD();
  if(d.cerrado){
    toast(`❌ El día ${fmtDd(curDate)} está cerrado. El administrador debe reabrirlo para importar compras.`);
    return;
  }
  // Handle duplicate factura — delete old records first, then insert new ones
  const folioCapturado=document.getElementById('xml-folio')?.value||xmlMeta.facturaId||xmlMeta.folio||'';
  // If same factura already exists: auto-replace silently (user is intentionally reimporting)
  if(folioCapturado){
    const existentes=(d.compras||[]).filter(r=>r.factura===folioCapturado);
    if(existentes.length>0){
      d.compras=(d.compras||[]).filter(r=>r.factura!==folioCapturado);
      addLog('compras','Factura reemplazada',`Factura ${folioCapturado} — ${existentes.length} registros anteriores eliminados y reemplazados`);
    }
  }
  const ac=activeC();
  // Validate: no duplicate SKUs within this import
  const skusUsados={};const errores=[];
  xmlParsedRows.forEach((r,i)=>{
    if(!r.sku) return;
    if(skusUsados[r.sku]!==undefined){
      const p=PRODS.find(x=>x.sku===r.sku);
      errores.push(`${p?.name||r.sku} aparece en concepto ${skusUsados[r.sku]+1} y ${i+1}`);
    } else {
      skusUsados[r.sku]=i;
    }
  });
  if(errores.length>0){
    toast(`❌ SKU duplicado: ${errores[0]}. Corrige antes de confirmar.`);
    return;
  }
  let count=0;
  xmlParsedRows.forEach(r=>{
    if(!r.sku) return;
    const costo=ac?.precios[r.sku]||r.unitPrice||0;
    // Save equivalencia only if it doesn't conflict with existing 1-to-1
    const key=r.noId||('DESC::'+r.desc.toLowerCase().trim());
    const dupDB=Object.entries(EQUIV_DB).find(([k,v])=>v.sku===r.sku&&k!==key);
    if(!dupDB) saveEquiv(r.noId,r.desc,r.sku);
    d.compras.push({
      id:uid(),sku:r.sku,name:r.matchedName||r.desc,
      qty:Number(r.qty),costo,total:Number(r.qty)*costo,
      factura:document.getElementById('xml-folio')?.value||xmlMeta.facturaId||xmlMeta.folio||'',
      ordenCompra:document.getElementById('xml-oc')?.value||xmlMeta.ordenCompra||'',
      xmlDesc:r.desc,xmlImporte:r.importe,
      origen:'XML: '+(xmlMeta.emisor||xmlMeta.tipo||'Factura'),
    });
    count++;
  });
  addLog('compras','Importación XML',`${count} conceptos importados desde XML — ${xmlMeta.emisor||'factura'}`);
  saveDD();saveEquivDB();closeMod();
  rPage('compras');
  toast(`${count} concepto(s) importados desde XML a Compras`);
}

      <td style="font-size:12px;color:var(--tx2);max-width:280px;white-space:normal">${l.detalle||'—'}</td>
    </tr>`).join('');
    tableHTML=`<div class="tw" style="overflow-x:auto"><table>
      <thead><tr><th>Fecha y hora</th><th>Usuario</th><th>Rol</th><th>Módulo</th><th>Acción</th><th>Detalle</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${filtered.length>500?`<p style="font-size:12px;color:var(--tx3);margin-top:8px">Mostrando los primeros 500 de ${filtered.length} registros. Exporta el CSV para ver todos.</p>`:''}`;
  }

  C.innerHTML=stats+filters+tableHTML;
}

function clearLogFilters(){
  ['log-from','log-to','log-mod','log-usr','log-bus'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.value=id==='log-from'?new Date(Date.now()-7*86400000).toISOString().split('T')[0]:id==='log-to'?ds():'Todos';
  });
  rPage('logreport');
}

function exportLog(){
  const headers=['Fecha','Hora','Usuario','Rol','Módulo','Acción','Detalle'];
  const rows=LOG.map(l=>[l.fecha,l.hora,l.usuario,l.rol,l.modulo,l.accion,l.detalle||''].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  const csv=[headers.join(','),...rows].join('\r\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='log_report.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Log exportado');
}

function clearLog(){
  if(!confirm('¿Seguro que deseas limpiar todo el log? Esta acción no se puede deshacer.')) return;
  LOG=[];saveLog();rPage('logreport');toast('Log limpiado');
}


// ── Pendiente Liquidar ─────────────────────────────────────────────────────
// Persistent list (NOT per date) — items stay until manually deleted
// Each: {id, sku, name, qty, motivo, fechaAlta}
let PTE_LIQUIDAR = DB.get('pteLiquidar', []);
function savePteLiquidar(){ DB.set('pteLiquidar', PTE_LIQUIDAR); }

function rPteLiquidar(C, A){
  A.innerHTML=`<button class="btn p" onclick="openAddPte()">+ Agregar producto</button>`;

  const totQty=PTE_LIQUIDAR.reduce((a,r)=>a+Number(r.qty||0),0);
  const stats=`<div class="sr" style="grid-template-columns:repeat(2,1fr);margin-bottom:16px">
    <div class="sc"><div class="sl">Productos pendientes</div><div class="sv" style="color:var(--amber)">${PTE_LIQUIDAR.length}</div></div>
    <div class="sc"><div class="sl">Total unidades</div><div class="sv">${totQty}</div></div>
  </div>`;

  const notice=`<div style="background:var(--amber-bg);color:var(--amber);border-radius:var(--r);padding:10px 14px;font-size:12px;margin-bottom:14px">
    &#9888;&#65039; Esta lista es permanente — los productos aquí aparecen en la columna <strong>Pte. Liquidar</strong> del Inventario diario hasta que los elimines manualmente.
  </div>`;

  if(PTE_LIQUIDAR.length===0){
    C.innerHTML=stats+notice+`<div class="tw"><div class="es">Sin productos pendientes de liquidar</div></div>`;
    return;
  }

  const rows=PTE_LIQUIDAR.map(r=>`<tr>
    <td><strong>${r.sku}</strong></td>
    <td>${r.name}</td>
    <td><strong>${r.qty}</strong></td>
    <td style="font-size:12px;color:var(--tx2)">${r.motivo||'—'}</td>
    <td style="font-size:11px;color:var(--tx3)">${r.fechaAlta||'—'}</td>
    <td style="display:flex;gap:6px">
      <button class="btn sm" onclick="openEditPte('${r.id}')">Editar</button>
      <button class="btn sm" style="color:var(--red)" onclick="deletePte('${r.id}')">✕ Liquidado</button>
    </td>
  </tr>`).join('');

  C.innerHTML=stats+notice+`<div class="tw"><table>
    <thead><tr><th>SKU</th><th>Producto</th><th>Cantidad</th><th>Motivo</th><th>Fecha alta</th><th>Acción</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function openAddPte(){
  const skuOpts=PRODS.map(p=>`<option value="${p.sku}">${p.sku} — ${p.name}</option>`).join('');
  showMod('Agregar a Pte. Liquidar',`
    <div class="fg"><label>Producto</label>
      <select id="pte-sku" onchange="fillPteName(this)">
        <option value="">— Seleccionar —</option>${skuOpts}
      </select>
    </div>
    <div class="fg"><label>Nombre</label><input id="pte-name" placeholder="Nombre del producto"></div>
    <div class="fr">
      <div class="fg"><label style="font-weight:600">Cantidad pendiente</label>
        <input id="pte-qty" type="number" min="0" value="" placeholder="Ej. 15"
          style="font-size:20px;padding:10px;text-align:center">
      </div>
      <div class="fg"><label>Motivo (opcional)</label>
        <input id="pte-mot" placeholder="ej. Producto dañado...">
      </div>
    </div>
  `,`<button class="btn" onclick="closeMod()">Cancelar</button><button class="btn p" onclick="savePte()">Agregar</button>`);
}

function fillPteName(sel){
  const p=PRODS.find(x=>x.sku===sel.value);
  const n=document.getElementById('pte-name');if(n&&p)n.value=p.name;
}

function savePte(){
  const sku=document.getElementById('pte-sku')?.value;
  const name=document.getElementById('pte-name')?.value;
  const qty=Number(document.getElementById('pte-qty')?.value||0);
  const motivo=document.getElementById('pte-mot')?.value||'';
  if(!sku){toast('Selecciona un producto');return}
  PTE_LIQUIDAR.push({id:uid(),sku,name,qty,motivo,fechaAlta:ds()});
  savePteLiquidar();
  addLog('pteliquidar','Nuevo registro',`Pte. Liquidar: SKU ${sku} — ${qty} unidades`);
  closeMod();rPage('pteliquidar');toast('Producto agregado a Pte. Liquidar');
}

function openEditPte(id){
  const r=PTE_LIQUIDAR.find(x=>x.id===id);if(!r)return;
  showMod('Editar Pte. Liquidar',`
    <div class="fg"><label>SKU</label><input value="${r.sku}" disabled style="opacity:.5"></div>
    <div class="fg"><label>Nombre</label><input id="epte-name" value="${r.name}"></div>
    <div class="fr">
      <div class="fg"><label style="font-weight:600">Cantidad pendiente</label>
        <input id="epte-qty" type="number" min="0" value="${r.qty}"
          style="font-size:20px;padding:10px;text-align:center">
      </div>
      <div class="fg"><label>Motivo (opcional)</label>
        <input id="epte-mot" value="${r.motivo||''}">
      </div>
    </div>
  `,`<button class="btn" onclick="closeMod()">Cancelar</button><button class="btn p" onclick="updatePte('${id}')">Actualizar</button>`);
}

function updatePte(id){
  const r=PTE_LIQUIDAR.find(x=>x.id===id);if(!r)return;
  r.name=document.getElementById('epte-name')?.value||r.name;
  r.qty=Number(document.getElementById('epte-qty')?.value||r.qty);
  r.motivo=document.getElementById('epte-mot')?.value||'';
  savePteLiquidar();
  addLog('pteliquidar','Actualizado',`Pte. Liquidar editado: SKU ${r.sku}`);
  closeMod();rPage('pteliquidar');toast('Actualizado');
}

function deletePte(id){
  const r=PTE_LIQUIDAR.find(x=>x.id===id);
  if(!confirm(`¿Confirmas que el producto "${r?.name}" fue liquidado y se eliminará de esta lista?`))return;
  PTE_LIQUIDAR=PTE_LIQUIDAR.filter(x=>x.id!==id);
  savePteLiquidar();
  addLog('pteliquidar','Eliminado',`Pte. Liquidar: SKU ${r?.sku} liquidado`);
  rPage('pteliquidar');toast('Producto marcado como liquidado y eliminado');
}


// ── Drag & drop para reordenar productos ─────────────────────────────────
let dragSrcIdx=null;
function dragProd(e,i){
  dragSrcIdx=i;
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',i);
  e.currentTarget.style.opacity='0.5';
}
function dropProd(e,i){
  e.preventDefault();
  if(dragSrcIdx===null||dragSrcIdx===i) return;
  // Reorder PRODS array
  const moved=PRODS.splice(dragSrcIdx,1)[0];
  PRODS.splice(i,0,moved);
  dragSrcIdx=null;
  saveProds();
  rPage('productos');
  toast('Orden actualizado');
}


// ── Órdenes de compra ──────────────────────────────────────────────────────
let ORDENES = DB.get('ordenes', []);
function saveOrdenes(){ DB.set('ordenes', ORDENES); }

function guardarOrdenCompra(){
  if(trailerPlan.length===0||trailerPlan.every(t=>t.items.length===0)){
    toast('El plan de trailers está vacío');return;
  }
  const base=Date.now();
  let guardadas=0;
  trailerPlan.forEach((t,i)=>{
    if(t.items.length===0) return;
    const folio='OC-'+String(base+i).slice(-6)+'-T'+t.id;
    const oc={
      id:uid(),
      folio,
      trailerLabel:t.label,
      fecha:ds(),
      hora:new Date().toTimeString().slice(0,5),
      estado:'Pendiente',
      items:t.items.map(it=>({...it})),
      totalTarimas:t.total,
      totalPaquetes:t.items.reduce((a,it)=>a+(it.paquetes||0),0),
      notas:''
    };
    ORDENES.unshift(oc);
    guardadas++;
  });
  saveOrdenes();
  addLog('ordenes','Nueva OC',`${guardadas} orden(es) creadas — una por trailer`);
  closeMod();
  nav('ordenes');
  toast(`✓ ${guardadas} orden(es) de compra guardadas`);
}

function rOrdenes(C,A){
  A.innerHTML=`<button class="btn" onclick="exportarTodasOC()">&#8681; Exportar CSV</button>`;

  const pend=ORDENES.filter(o=>o.estado==='Pendiente').length;
  const rec=ORDENES.filter(o=>o.estado==='Recibida').length;

  const stats=`<div class="sr" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">
    <div class="sc"><div class="sl">Total órdenes</div><div class="sv">${ORDENES.length}</div></div>
    <div class="sc"><div class="sl">Pendientes</div><div class="sv" style="color:var(--amber)">${pend}</div></div>
    <div class="sc"><div class="sl">Recibidas</div><div class="sv" style="color:var(--green)">${rec}</div></div>
  </div>`;

  if(ORDENES.length===0){
    C.innerHTML=stats+`<div class="tw"><div class="es">Sin órdenes de compra.<br>
      <span style="font-size:12px;color:var(--tx3)">Genera una desde <strong>Pedido → 🚛 Plan trailers desde tabla → Guardar como OC</strong></span>
    </div></div>`;
    return;
  }

  const rows=ORDENES.map(oc=>`<tr>
    <td><strong>${oc.folio}</strong></td>
    <td style="font-size:12px;color:var(--blue)">🚛 ${oc.trailerLabel||'Trailer'}</td>
    <td style="font-size:12px">${oc.fecha} ${oc.hora}</td>
    <td style="text-align:center">${oc.totalTarimas}</td>
    <td style="text-align:center">${oc.totalPaquetes||0}</td>
    <td style="text-align:center">${oc.items.length}</td>
    <td><span class="badge ${oc.estado==='Pendiente'?'low':'ok'}">${oc.estado}</span></td>
    <td style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn sm" onclick="verOC('${oc.id}')">Ver detalle</button>
      ${oc.estado==='Pendiente'?`<button class="btn sm" style="color:var(--green)" onclick="recibirOC('${oc.id}')">✓ Recibida</button>`:''}
      <button class="btn sm" style="color:var(--red)" onclick="eliminarOC('${oc.id}')">✕</button>
    </td>
  </tr>`).join('');

  C.innerHTML=stats+`<div class="tw"><table>
    <thead><tr><th>Folio</th><th>Trailer</th><th>Fecha</th><th>Tarimas</th><th>Paquetes</th><th>Productos</th><th>Estado</th><th>Acciones</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function verOC(id){
  const oc=ORDENES.find(x=>x.id===id);if(!oc)return;
  const itemRows=oc.items.map(it=>`<tr>
    <td><strong>${it.sku}</strong></td>
    <td>${it.name}</td>
    <td style="text-align:center">${it.tarimas}</td>
    <td style="text-align:center">${it.paquetes||0}</td>
    <td style="text-align:center;color:${it.diasEx<=7?'var(--red)':it.diasEx<=14?'var(--amber)':'var(--green)'}">
      ${it.diasEx>=9999?'Sin datos':it.diasEx+' días'}
    </td>
  </tr>`).join('');

  showMod(`📦 ${oc.folio}`,`
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:13px;color:var(--tx2)">
      <span>🚛 ${oc.trailerLabel||'Trailer'}</span>
      <span>📅 ${oc.fecha} ${oc.hora}</span>
      <span>📦 ${oc.totalTarimas} tarimas · ${oc.totalPaquetes||0} paquetes</span>
      <span class="badge ${oc.estado==='Pendiente'?'low':'ok'}">${oc.estado}</span>
      ${oc.fechaRecibida?`<span style="color:var(--green)">Recibida: ${oc.fechaRecibida}</span>`:''}
    </div>
    <div class="tw" style="max-height:320px;overflow-y:auto"><table>
      <thead><tr><th>SKU</th><th>Producto</th><th>Tarimas</th><th>Paquetes</th><th>Días exist.</th></tr></thead>
      <tbody>${itemRows||'<tr><td colspan="5" style="text-align:center;color:var(--tx3)">Sin productos</td></tr>'}</tbody>
    </table></div>
    <div class="fg" style="margin-top:12px">
      <label style="font-size:12px">Notas / Núm. factura proveedor</label>
      <input id="oc-notas" value="${oc.notas||''}" placeholder="ej. Factura A-2195790, observaciones..."
        style="font-size:13px" onchange="ORDENES.find(x=>x.id==='${id}').notas=this.value;saveOrdenes()">
    </div>
  `,`
    <button class="btn" onclick="closeMod()">Cerrar</button>
    <button class="btn" onclick="exportarOC('${id}')">&#8681; Exportar CSV</button>
    ${oc.estado==='Pendiente'?`<button class="btn p" onclick="recibirOC('${id}');closeMod()">✓ Marcar como recibida</button>`:''}
  `);
}

function recibirOC(id){
  const oc=ORDENES.find(x=>x.id===id);if(!oc)return;
  if(!confirm(`¿Confirmas que la orden ${oc.folio} fue recibida?`))return;
  oc.estado='Recibida';
  oc.fechaRecibida=ds();
  saveOrdenes();
  addLog('ordenes','OC recibida',`${oc.folio} marcada como recibida`);
  rPage('ordenes');
  toast(`✓ ${oc.folio} marcada como recibida`);
}

function eliminarOC(id){
  const oc=ORDENES.find(x=>x.id===id);if(!oc)return;
  if(!confirm(`¿Eliminar la orden ${oc.folio}? Esta acción no se puede deshacer.`))return;
  ORDENES=ORDENES.filter(x=>x.id!==id);
  saveOrdenes();
  rPage('ordenes');
  toast('Orden eliminada');
}

function exportarOC(id){
  const oc=ORDENES.find(x=>x.id===id);if(!oc)return;
  const esc=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[['SKU','Producto','Tarimas','Paquetes'].join(',')];
  oc.items.forEach(it=>rows.push([it.sku,it.name,it.tarimas,it.paquetes||0].map(esc).join(',')));
  const csv=[oc.folio+' - '+oc.trailerLabel,'Fecha: '+oc.fecha,'Estado: '+oc.estado,...rows].join('\r\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=oc.folio+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  toast(oc.folio+' exportada');
}

function exportarTodasOC(){
  const esc=v=>`"${String(v).replace(/"/g,'""')}"`;
  const rows=[['Folio','Trailer','Fecha','Tarimas','Paquetes','Estado'].join(',')];
  ORDENES.forEach(oc=>rows.push([oc.folio,oc.trailerLabel||'',oc.fecha,oc.totalTarimas,oc.totalPaquetes||0,oc.estado].map(esc).join(',')));
  const csv=rows.join('\r\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`ordenes_compra.csv`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  toast('Órdenes exportadas');
}

// ══════════════════════════════════════════════════════════════════════════
// INICIO DE LA APLICACIÓN — con autenticación
// ══════════════════════════════════════════════════════════════════════════
(async function initApp(){
  // Si no hay token, mostrar login
  if(!Auth.isLoggedIn()){
    showLogin();
    return;
  }

  // Mostrar usuario en sidebar y botón logout en topbar
  const user = Auth.getUser();
  if(user){
    const nb = document.getElementById('user-badge-nombre');
    const rb = document.getElementById('user-badge-rol');
    if(nb) nb.textContent = user.nombre;
    if(rb) rb.textContent = user.rol === 'admin' ? 'Administrador' : 'Operador';
  }
  const actions = document.getElementById('pactions');
  if(actions){
    const logoutBtn = document.createElement('div');
    logoutBtn.style.cssText = 'display:flex;align-items:center;gap:8px;margin-left:8px;padding-left:12px;border-left:0.5px solid var(--brd)';
    logoutBtn.innerHTML = `<button class="btn sm" onclick="doLogout()" style="color:var(--tx2)">Salir</button>`;
    actions.appendChild(logoutBtn);
  }

  // Cargar módulos del usuario desde el backend
  try {
    const perfil = await apiFetch('/api/usuarios/me');
    if(perfil && perfil.modulos) {
      user.modulos = JSON.parse(perfil.modulos);
      Auth.setUser(user);
    }
  } catch(e){ /* si falla, usa lo que hay */ }

  // Construir sidebar según permisos del usuario
  buildSidebar(user);

  // Cargar datos del backend (con fallback a localStorage)
  await DB._loadAll();

  // Iniciar navegación — primer módulo permitido
  const firstMod = user && user.modulos && user.modulos.length ? user.modulos[0] : 'inv';
  nav(firstMod);
})();

function buildSidebar(user){
  const NAV_ITEMS = [
    {sec:'Principal', items:[
      {id:'dashboard',label:'🏠 Dashboard'},
      {id:'inv',      label:'📊 Inventario diario'},
      {id:'conteos',  label:'🔢 Conteos'},
      {id:'pedido',   label:'🛒 Pedido'},
      {id:'ordenes',  label:'🗒️ Órdenes de compra'},
      {id:'productos',label:'📦 Productos'},
    ]},
    {sec:'Entradas', items:[
      {id:'compras',     label:'🏭 Compras'},
      {id:'devoluciones',label:'↩️ Devoluciones'},
    ]},
    {sec:'Salidas', items:[
      {id:'ventas',     label:'💰 Ventas'},
      {id:'cargas',     label:'🚛 Cargas'},
      {id:'nocargado',  label:'🚫 No cargado'},
      {id:'mermas',     label:'⚠️ Mermas'},
      {id:'pteliquidar',label:'💸 Pte. Liquidar'},
    ]},
    {sec:'Precios', items:[
      {id:'precios',label:'🏷️ Lista de precios'},
    ]},
    {sec:'Análisis', items:[
      {id:'ajustes', label:'🔧 Ajustes'},
      {id:'reportes',label:'📈 Reportes'},
    ]},
    {sec:'Sistema', items:[
      {id:'usuarios',    label:'👥 Usuarios'},
      {id:'logreport',   label:'📋 Log Report'},
      {id:'equivalencias',label:'🔗 Equivalencias XML'},
    ]},
  ];

  // Admin ve todo; operador ve solo sus módulos permitidos
  const allowed = (user && user.rol === 'admin') ? null : (user && user.modulos ? user.modulos : []);

  let html = '';
  NAV_ITEMS.forEach(({sec, items}) => {
    const visible = allowed === null ? items : items.filter(i => allowed.includes(i.id));
    if(!visible.length) return;
    html += `<div class="sec">${sec}</div>`;
    visible.forEach(i => {
      html += `<div class="ni" onclick="nav('${i.id}')">${i.label}</div>`;
    });
  });

  document.getElementById('sidebar-nav').innerHTML = html;

  // Guardar módulos permitidos en Auth para uso posterior
  if(user) user.modulos = allowed === null ? NAV_ITEMS.flatMap(g=>g.items.map(i=>i.id)) : allowed;
}

function doLogout(){
  Auth.clearToken();
  location.reload();
}

// ── Recarga automática de datos cada 30 segundos ──────────────────────────
let _autoReloadPaused = false;
// Módulos que NO deben re-renderizarse en el auto-refresh (el usuario puede estar interactuando)
const _NO_AUTORRENDER = new Set(['reportes','inv','conteos']);
setInterval(async () => {
  if(_autoReloadPaused || !Auth.isLoggedIn()) return;
  try {
    await DB._loadAll();
    // Solo re-renderiza módulos simples — nunca reportes ni inventario diario
    const page = document.querySelector('.ni.active')?.getAttribute('onclick')?.match(/nav\('(\w+)'\)/)?.[1];
    if(page && !_NO_AUTORRENDER.has(page)) rPage(page);
  } catch(e){ /* silencioso */ }
}, 30000);
</script>
