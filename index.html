*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f5f4;--bg3:#f0efed;

  --amber-bg:#FAEEDA;--amber:#854F0B;
  --red-bg:#FCEBEB;--red:#A32D2D;
  --blue-bg:#E6F1FB;--blue:#185FA5;
  --purple-bg:#EEEDFE;--purple:#534AB7;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#141414;
    --tx:#f5f5f5;--tx2:#a0a0a0;--tx3:#666;
    --brd:rgba(255,255,255,.08);--brd2:rgba(255,255,255,.15);
    --green-bg:#1a2e0d;--green:#7ec44f;
    --amber-bg:#2e1e05;--amber:#f0a030;
    --red-bg:#2e0d0d;--red:#f07070;
    --blue-bg:#0d1e2e;--blue:#60a8f0;
    --purple-bg:#1a1830;--purple:#9b8ff0;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--tx);background:var(--bg3);display:flex;height:100vh;overflow:hidden}
.sidebar{width:215px;min-width:215px;background:var(--bg);border-right:0.5px solid var(--brd);display:flex;flex-direction:column;overflow-y:auto}
.logo{padding:18px 16px 14px;font-size:15px;font-weight:700;border-bottom:0.5px solid var(--brd)}
.sec{padding:12px 12px 4px;font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.ni{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:1px 6px;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--tx2);transition:background .12s;user-select:none}

.ni.active{background:var(--bg2);color:var(--tx);font-weight:500}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

.topbar h1{font-size:16px;font-weight:500;flex:1}
.content{flex:1;overflow-y:auto;padding:20px}
.btn{padding:7px 14px;border-radius:var(--r);border:0.5px solid var(--brd2);background:var(--bg);cursor:pointer;font-size:13px;color:var(--tx);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-family:inherit}
.btn:hover{background:var(--bg2)}

.btn.s{background:var(--green);color:#fff;border-color:transparent}

.dn{display:flex;align-items:center;gap:6px;background:var(--bg);border:0.5px solid var(--brd2);border-radius:var(--r);padding:5px 10px}
.db{border:none;background:none;cursor:pointer;color:var(--tx2);padding:2px 6px;border-radius:4px;font-size:17px;line-height:1}
.db:hover{background:var(--bg2)}
.dl{min-width:120px;text-align:center;font-weight:500;font-size:13px}
.vt{display:flex;border:0.5px solid var(--brd2);border-radius:var(--r);overflow:hidden}
.vb{padding:6px 13px;background:none;border:none;cursor:pointer;font-size:12px;color:var(--tx2)}
.vb.active{background:var(--bg2);color:var(--tx);font-weight:500}
.sc{background:var(--bg2);border-radius:var(--r);padding:14px 16px}
.sl{font-size:12px;color:var(--tx2);margin-bottom:6px}
.sv{font-size:22px;font-weight:600}
.sr{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.tw{background:var(--bg);border:0.5px solid var(--brd);border-radius:var(--r2);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg2);padding:9px 14px;text-align:left;font-weight:500;font-size:11.5px;color:var(--tx2);border-bottom:0.5px solid var(--brd);white-space:nowrap}
td{padding:9px 14px;border-bottom:0.5px solid var(--brd);color:var(--tx)}

.badge.amb{background:var(--amber-bg);color:var(--amber)}
.ok{background:var(--green-bg);color:var(--green)}
.low{background:var(--amber-bg);color:var(--amber)}

.md{background:var(--bg);border-radius:var(--r2);padding:24px;width:540px;max-width:96vw;max-height:90vh;overflow-y:auto;border:0.5px solid var(--brd2)}

<script>
// ══════════════════════════════════════════════════════════════════════════
// CONFIGURACIÓN DEL BACKEND
// ══════════════════════════════════════════════════════════════════════════
const API_URL = 'https://web-production-5fbf4.up.railway.app';

// ══════════════════════════════════════════════════════════════════════════
// AUTENTICACIÓN JWT
// ══════════════════════════════════════════════════════════════════════════
const Auth = {
  getToken(){ return localStorage.getItem('inventapro:token'); },
  setToken(t){ localStorage.setItem('inventapro:token', t); },
  clearToken(){ localStorage.removeItem('inventapro:token'); localStorage.removeItem('inventapro:currentUser'); },
  getUser(){
    try{ return JSON.parse(localStorage.getItem('inventapro:currentUser')); }catch(e){ return null; }
  },
  setUser(u){ localStorage.setItem('inventapro:currentUser', JSON.stringify(u)); },
  isLoggedIn(){ return !!this.getToken(); }
};

async function apiFetch(path, options={}){
  const token = Auth.getToken();
  const headers = { 'Content-Type': 'application/json', ...(options.headers||{}) };
  if(token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_URL + path, { ...options, headers });
  if(res.status === 401 || res.status === 403){ Auth.clearToken(); showLogin(); throw new Error('Sesión expirada'); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'Error del servidor');
  return data;
}

// ══════════════════════════════════════════════════════════════════════════
// PANTALLA DE LOGIN
// ══════════════════════════════════════════════════════════════════════════
function doLogout(){
  Auth.clearToken();
  showLogin();
}
function showLogin(){
  document.body.innerHTML = `
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg3);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">

      <div style="font-size:22px;font-weight:700;margin-bottom:4px">📦 InventaPro</div>
      <div style="font-size:13px;color:var(--tx2);margin-bottom:28px">Inicia sesión para continuar</div>
      <div id="login-err" style="display:none;background:var(--red-bg);color:var(--red);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px"></div>
      <div style="margin-bottom:14px">
        <label style="display:block;font-size:12px;color:var(--tx2);margin-bottom:4px">Usuario</label>
        <input id="li-email" type="text" placeholder="admin" style="width:100%;padding:9px 12px;border:0.5px solid var(--brd2);border-radius:8px;background:var(--bg);color:var(--tx);font-size:14px;font-family:inherit" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div style="margin-bottom:22px">
        <label style="display:block;font-size:12px;color:var(--tx2);margin-bottom:4px">Contraseña</label>
        <input id="li-pass" type="password" placeholder="••••••••" style="width:100%;padding:9px 12px;border:0.5px solid var(--brd2);border-radius:8px;background:var(--bg);color:var(--tx);font-size:14px;font-family:inherit" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button id="li-btn" onclick="doLogin()" style="width:100%;padding:10px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit">Iniciar sesión</button>
    </div>
  </div>`;
}

async function doLogin(){
  const email = document.getElementById('li-email').value.trim();
  const pass  = document.getElementById('li-pass').value;
  const btn   = document.getElementById('li-btn');
  const err   = document.getElementById('login-err');
  if(!email||!pass){ err.style.display='block'; err.textContent='Ingresa usuario y contraseña'; return; }
  btn.textContent = 'Iniciando sesión…'; btn.disabled = true;
  try{
    const data = await apiFetch('/api/auth/login', { method:'POST', body: JSON.stringify({usuario: email, password: pass}) });
    Auth.setToken(data.token);
    Auth.setUser(data.usuario);
    location.reload();
  } catch(e){
    err.style.display='block'; err.textContent = e.message || 'Error al iniciar sesión';
    btn.textContent = 'Iniciar sesión'; btn.disabled = false;
  }
}

// ══════════════════════════════════════════════════════════════════════════
// CAPA DE PERSISTENCIA — API Backend (reemplaza localStorage)
// Los datos se sincronizan con el servidor en tiempo real.
// Se mantiene un caché local para velocidad de UI.
// ══════════════════════════════════════════════════════════════════════════
const _cache = {};

const DB = {
  get(key, fallback=null){
    if(_cache[key] !== undefined) return _cache[key];
    try{
      const v=localStorage.getItem('inventapro:'+key);
      return v!==null?JSON.parse(v):fallback;
    }catch(e){return fallback;}
  },
  set(key, value){
    _cache[key] = value;
    try{localStorage.setItem('inventapro:'+key, JSON.stringify(value));}
    catch(e){console.warn('localStorage full:',e);}
    // Sync to backend asynchronously
    DB._sync(key, value);
  },
  clear(){
    Object.keys(_cache).forEach(k=>delete _cache[k]);
    Object.keys(localStorage).filter(k=>k.startsWith('inventapro:')).forEach(k=>{
      if(!['token','currentUser'].includes(k.replace('inventapro:','')))
        localStorage.removeItem(k);
    });
  },
  // Sync key→value to the API backend
  _sync(key, value){
    const token = Auth.getToken();
    if(!token) return;
    fetch(API_URL + '/api/sync/' + key, {
      method: 'PUT',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
      body: JSON.stringify({ value })
    }).catch(()=>{}); // silent fail — data is safe in localStorage
  },
  // Load all data from backend on startup
  async _loadAll(){
    try{
      const data = await apiFetch('/api/sync');
      Object.entries(data).forEach(([k,v])=>{
        _cache[k] = v;
        try{ localStorage.setItem('inventapro:'+k, JSON.stringify(v)); }catch(e){}
      });
      return true;
    }catch(e){
      console.warn('Backend no disponible, usando localStorage:', e.message);
      return false;
    }
  }
};

function fmtD(d){return new Date(d+'T12:00').toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'})}
function fmtDd(d){return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'})}

function f2(n){return Number(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}
// Compute derived fechaFin for a period: day before next period starts, or null if it's the last one
function periodoFin(lista,p){
  const sorted=[...lista].sort((a,b)=>a.fechaInicio.localeCompare(b.fechaInicio));
  const idx=sorted.findIndex(x=>x.id===p.id);
  if(idx===-1||idx===sorted.length-1)return null; // last = open ended
  const nextStart=new Date(sorted[idx+1].fechaInicio+'T12:00');
  nextStart.setDate(nextStart.getDate()-1);
  return nextStart.toISOString().split('T')[0];
}
function periodoFinLabel(lista,p){const f=periodoFin(lista,p);return f?fmtD(f):'Vigente hasta nuevo aviso'}
function pstatus(lista,p){
  const t=ds();
  if(t<p.fechaInicio)return 'prox';
  const fin=periodoFin(lista,p);
  if(fin&&t>fin)return 'venc';
  return 'vig';
}
function plabel(lista,p){
  const t=ds();
  if(t<p.fechaInicio)return 'Próximo';
  const fin=periodoFin(lista,p);
  if(fin&&t>fin)return 'Vencido';
  return 'Vigente';
}
function activeC(){
  const t=ds();const sorted=[...listasC].sort((a,b)=>a.fechaInicio.localeCompare(b.fechaInicio));
  // Find last period whose fechaInicio <= today
  let active=null;
  for(const p of sorted){if(p.fechaInicio<=t)active=p;}
  return active||sorted[0];
}
function activeV(){
  const t=ds();const sorted=[...listasV].sort((a,b)=>a.fechaInicio.localeCompare(b.fechaInicio));
  let active=null;
  for(const p of sorted){if(p.fechaInicio<=t)active=p;}
  return active||sorted[0];
}

          :`<span style="color:var(--tx3);font-size:11px">Sin datos IVA</span>`;
        return `<tr><td><strong>${p.sku}</strong></td><td>${p.name}</td>
          <td class="pv">${v!==undefined?'$'+f2(v):'-'}</td>
          <td>${sinIvaStr}</td>
          <td>${c!==undefined?'$'+f2(c):'-'}</td>
          <td>${mg!==null?`<span class="${mg>=0?'mp':'mn'}">${mg>=0?'+':''}${mg.toFixed(1)}%</span>`:'-'}</td></tr>`;
      }).join('');
      det=`<div class="div"></div>
        <div class="rop">&#8505;&#65039; Los precios de venta son de solo lectura. Para modificarlos, importa una nueva plantilla con las fechas de vigencia del nuevo periodo.</div>

          <span class="badge ${pstatus(listasV,selP)}">${plabel(listasV,selP)}</span>
        </div>
        <div style="margin-bottom:10px">
          <input id="precio-search" type="text" placeholder="🔍 Buscar por SKU o nombre de producto..."
            style="width:100%;padding:9px 12px;border:0.5px solid var(--brd2);border-radius:var(--r);background:var(--bg);color:var(--tx);font-size:13px;font-family:inherit"
            oninput="filterPreciosTable(this.value,'precio-tbody')">

    }
    C.innerHTML=tabs+perHTML+det;
  }

function processFile(file){
  const status=document.getElementById('file-status');
  const btnR=document.getElementById('btn-revisar');
  if(status) status.textContent='Leyendo archivo: '+file.name+'...';

  const ext=file.name.split('.').pop().toLowerCase();

  if(ext==='txt'||ext==='csv'){
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const text=e.target.result;
        // Detectar si es reporte INRENOSA (contiene "Reporte de Diferencias en Ventas" o "Venta Ruta")
        const esInrenosa=text.includes('Reporte de Diferencias')&&text.includes('Venta');
        const parsed=esInrenosa?parseInrenosaTxt(text):parseCSV(text);
        if(parsed.length===0){if(status)status.textContent='El archivo está vacío o no tiene el formato correcto.';return}
        impParsed=parsed;
        if(status)status.textContent=`✅ ${parsed.length} registros listos${esInrenosa?' (reporte INRENOSA detectado)':''} — ${file.name}`;
        if(btnR){btnR.style.opacity='1';btnR.style.pointerEvents='auto';}
      }catch(err){if(status)status.textContent='Error al leer archivo: '+err.message;}
    };
    reader.readAsText(file,'UTF-8');
  } else if(ext==='xlsx'||ext==='xls'){
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const parsed=parseXLSX(e.target.result);
        if(parsed.length===0){if(status)status.textContent='El archivo está vacío o no tiene el formato correcto.';return}
        impParsed=parsed;
        if(status)status.textContent='✅ '+parsed.length+' registros listos — '+file.name;
        if(btnR){btnR.style.opacity='1';btnR.style.pointerEvents='auto';}
      }catch(err){if(status)status.textContent='Error al leer Excel: '+err.message+'. Intenta guardarlo como CSV primero.';}
    };
    reader.readAsArrayBuffer(file);
  } else {
    if(status)status.textContent='Formato no soportado. Usa .csv, .xlsx o .xls';
  }
}

// Parser para reporte de diferencias INRENOSA (.txt)
// Formato: "  1234 Descripcion producto       NNN   NNN   NNN"
// Toma la columna "Venta Ruta" (primer número tras la descripción)
function parseInrenosaTxt(text){
  const results=[];
  const lines=text.split(/\r?\n/);
  // Una línea de producto válida: empieza con espacios + 3-5 dígitos de SKU + descripción + números
  // Excluir líneas de encabezado, subtotal, total y separadores
  const skipPat=/SubTotal|Total\s|Página|Programa|Generación|Hora|Producto|Ruta|APT|Diferencia|---+|BEBIDAS|INRENOSA|^\s*$/i;
  const prodPat=/^\s{0,8}(\d{3,5})\s+\S.{5,}\s+([\d,]+)\s+([\d,]+)/;

  for(const line of lines){
    if(skipPat.test(line)) continue;
    const m=line.match(prodPat);
    if(!m) continue;
    const sku=m[1].trim();
    // cantidad = Venta Ruta (primer número, m[2])
    const qty=parseInt(m[2].replace(/,/g,''),10);
    if(!sku||isNaN(qty)||qty===0) continue;
    // Buscar si ya existe el SKU (puede repetirse en páginas distintas)
    const existing=results.find(r=>r.sku===sku);
    if(existing) existing.qty+=qty;
    else results.push({sku, qty, name:''});
  }

  // Convertir al formato que espera impParsed: [{sku, qty}]
  return results.map(r=>({sku:r.sku, qty:r.qty}));
}

function parseCSV(text){
  // Remove BOM if present
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const lines=text.split(/\r?\n/).filter(l=>l.trim()&&!l.trim().startsWith('#'));
  if(lines.length<2) return [];

  // Parse header row
  const headers=parseCSVRow(lines[0]).map(h=>h.trim().toLowerCase());

  // Column mapping based on module
  const COL_MAP={
    'precios-compra':{sku:['sku'],name:['nombre producto','nombre','producto'],costo:['costo unitario','costo','precio compra']},
    'precios-venta':{sku:['sku'],name:['nombre producto','nombre','producto'],precio:['precio de venta','precio venta','precio']},
    ventas:{sku:['sku'],name:['nombre producto','nombre','producto'],qty:['cantidad','qty','unidades']},
    compras:{sku:['sku'],name:['nombre producto','nombre','producto'],qty:['cantidad','qty','unidades']},
    devoluciones:{sku:['sku'],name:['nombre producto','nombre','producto'],qty:['cantidad','qty','unidades'],motivo:['motivo']},
    mermas:{sku:['sku'],name:['nombre producto','nombre','producto'],qty:['cantidad','qty','unidades'],motivo:['motivo']},
    cargas:{sku:['sku'],name:['nombre producto','nombre','producto'],qty:['cantidad','qty','unidades']},
    nocargado:{sku:['sku'],name:['nombre producto','nombre','producto'],qty:['cantidad','qty','unidades']},
    ajustes:{sku:['sku'],name:['nombre producto','nombre','producto'],qty_antes:['cantidad anterior','antes'],qty_despues:['cantidad nueva','despues','después'],motivo:['motivo']},
    piso:{sku:['sku'],name:['nombre producto','nombre','producto'],piso:['existencia en piso','existencia piso','existencia','piso','conteo','cantidad conteo','cantidad']},
    productos:{sku:['sku'],name:['nombre producto','nombre','producto'],tipo:['tipo','type'],empaque:['empaque','paquete','pack'],tarima:['cajas por tarima','tarima','cajas/tarima'],ml:['mililitros','ml','mililiters']},
  };

  const mapping=COL_MAP[impMod]||{};
  // Find column indices — case insensitive, trimmed
  const headersNorm=headers.map(h=>h.toLowerCase().trim());
  const colIdx={};
  Object.entries(mapping).forEach(([field,aliases])=>{
    const idx=headersNorm.findIndex(h=>aliases.some(a=>h.includes(a.toLowerCase())));
    if(idx>=0) colIdx[field]=idx;
  });

  const rows=[];
  for(let i=1;i<lines.length;i++){
    const vals=parseCSVRow(lines[i]);
    if(!vals.length||vals.every(v=>!v.trim())) continue;
    const row={};
    Object.entries(colIdx).forEach(([field,idx])=>{row[field]=(vals[idx]||'').trim()});
    // If no mapping found, use positional
    if(Object.keys(colIdx).length===0){
      const keys=Object.keys(mapping);
      keys.forEach((k,i)=>{row[k]=(vals[i]||'').trim()});
    }
    if(row.sku){
      // Skip rows with qty=0 for ventas only (template pre-fill rows) — NOT for piso (0 is a valid conteo)
      if(impMod==='ventas'&&(Number(row.qty)===0||row.qty===''||row.qty==='0')) continue;
      // For piso: if piso field not mapped or empty, scan ALL columns after index 1 for first non-empty numeric value
      if(impMod==='piso'&&(row.piso===undefined||row.piso==='')){
        for(let ci=2;ci<vals.length;ci++){
          const v=(vals[ci]||'').trim();
          if(v!==''&&!isNaN(Number(v))){
            row.piso=v;
            break;
          }
        }
      }
      rows.push(row);
    }
  }
  return rows;
}

function parseCSVRow(line){
  const result=[];let cur='';let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){
      if(inQ&&line[i+1]==='"'){cur+='"';i++;}
      else inQ=!inQ;
    } else if(c===','&&!inQ){result.push(cur);cur='';}
    else cur+=c;
  }
  result.push(cur);
  return result;
}

function parseXLSX(buffer){
  try{
    // Use SheetJS loaded via CDN in the page
    if(typeof XLSX!=='undefined'){
      const wb=XLSX.read(buffer,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(data.length<2) return [];
      // Convert to CSV-like text and parse through parseCSV
      const csvLines=data.map(row=>row.map(cell=>{
        const s=String(cell==null?'':cell).replace(/"/g,'""');
        return s.includes(',')||s.includes('"')||s.includes('\n')?`"${s}"`:s;
      }).join(','));
      return parseCSV(csvLines.join('\n'));
    }
    // Fallback: try reading as text
    const bytes=new Uint8Array(buffer);
    const text=new TextDecoder('utf-8').decode(bytes);
    if(text.includes('<html')||text.includes('<?xml')) throw new Error('XLSX real detectado');
    return parseCSV(text);
  }catch(e){
    throw new Error('Para importar Excel necesitas tener conexión a internet la primera vez (carga SheetJS). Si no tienes conexión, guarda el archivo como CSV UTF-8 desde Excel.');
  }
}

}

function confImp(nombre,inicio){
  if(impMod==='precios-compra'){
    const id='lc'+uid();const precios={};
    impParsed.forEach(r=>{precios[r.sku]=Number(r.costo)});
    listasC.push({id,nombre:nombre||'Lista compra importada',fechaInicio:inicio,precios});
    addLog('precios','Importación',`Lista precios compra importada — ${impParsed.length} productos`);
    saveListasC();selPeriodId=id;closeMod();rPage('precios');toast('Lista de precios de compra importada — '+impParsed.length+' productos');
  } else if(impMod==='precios-venta'){
    const id=impPeriodId||('lv'+uid());
    const existing=listasV.find(x=>x.id===id);
    if(existing){impParsed.forEach(r=>{existing.precios[r.sku]=Number(r.precio)});selPeriodId=id;}
    else{const precios={};impParsed.forEach(r=>{precios[r.sku]=Number(r.precio)});listasV.push({id,nombre:nombre||'Lista venta importada',fechaInicio:inicio,precios});selPeriodId=id;}
    addLog('precios','Importación',`Lista precios venta importada — ${impParsed.length} productos`);
    saveListasV();impPeriodId=null;closeMod();rPage('precios');toast('Lista de precios de venta importada — '+impParsed.length+' productos');
  } else if(impMod==='piso'){
    // Use impDate directly — avoid any function that might read wrong day
    const key=impDate||ds();
    if(!DD[key])DD[key]={ventas:[],compras:[],devoluciones:[],mermas:[],cargas:[],ajustes:[],piso:{},cerrado:false};
    const d=DD[key];
    if(d.conteoConfirmado){toast('El conteo ya fue confirmado y está bloqueado');closeMod();return}
    // REPLACE entire piso for this day — start fresh
    d.piso={};
    let pisoCount=0;
    impParsed.forEach(r=>{
      if(!r.sku) return;
      const rawVal=r.piso!==undefined?r.piso:r.qty;
      if(rawVal===undefined||rawVal==='') return;
      const val=Number(rawVal);
      d.piso[String(r.sku)]=val;
      d.piso[Number(r.sku)]=val;
      pisoCount++;
    });
    addLog('conteos','Importación',`Piso importado — ${pisoCount} SKUs (${key})`);
    const [y,mo,dy]=key.split('-').map(Number);curDate=new Date(y,mo-1,dy);
    saveDD();closeMod();rPage('conteos');
    toast(`✓ ${pisoCount} SKUs en DD["${key}"] | SKU120=${DD[key]?.piso?.['120']??DD[key]?.piso?.[120]??'NO ENCONTRADO'} | Headers: ${Object.entries(colIdx).map(([k,v])=>k+'@'+v).join(',')||'NINGUNO (posicional)'}`);
  } else if(impMod==='productos'){
    let creados=0,actualizados=0;
    impParsed.forEach(r=>{
      if(!r.sku) return;
      const existing=PRODS.find(p=>p.sku===r.sku);
      if(existing){
        if(r.name) existing.name=r.name;
        if(r.tipo) existing.tipo=r.tipo;
        if(r.empaque!==undefined&&r.empaque!=='') existing.empaque=Number(r.empaque);
        if(r.ml!==undefined&&r.ml!=='') existing.ml=Number(r.ml);
        if(r.tarima!==undefined&&r.tarima!=='') existing.tarima=Number(r.tarima);
        actualizados++;
      } else {
        PRODS.push({sku:r.sku,name:r.name||'',cat:'',tipo:r.tipo||'',empaque:Number(r.empaque)||0,stock:0,min:0,unit:'pza'});
        creados++;
      }
    });
    addLog('productos','Importación',`Productos: ${creados} nuevos, ${actualizados} actualizados`);
    saveProds();closeMod();rPage('productos');
    toast(`Productos importados: ${creados} nuevos, ${actualizados} actualizados`);
  } else {
    const d=ensImpD();if(!d[impMod])d[impMod]=[];
    const MODS_REEMPLAZAR=['ventas','cargas','devoluciones','mermas','nocargado'];
    if(MODS_REEMPLAZAR.includes(impMod)){
      d[impMod]=[];
    }
    // For compras via Excel: auto-replace same factura silently
    if(impMod==='compras'){
      const facturasComing=[...new Set(impParsed.map(r=>r.factura||'').filter(Boolean))];
      facturasComing.forEach(fac=>{
        const count=(d.compras||[]).filter(r=>r.factura===fac).length;
        if(count>0){
          d.compras=d.compras.filter(r=>r.factura!==fac);
          addLog('compras','Factura reemplazada',`Factura ${fac} — ${count} registros reemplazados via Excel`);
        }
      });
    }
    impParsed.forEach(r=>{const row={id:uid(),...r};if(row.qty&&row.precio)row.total=Number(row.qty)*Number(row.precio);if(row.qty&&row.costo)row.total=Number(row.qty)*Number(row.costo);d[impMod].push(row)});
    addLog(impMod,'Importación',`${impParsed.length} registros importados a ${impMod}`);
    if(impDate){const [y,m,d2]=impDate.split('-').map(Number);curDate=new Date(y,m-1,d2);}
    saveDD();closeMod();rPage(curPage);toast(impParsed.length+' registros importados');
  }
}

const MC={
  // precio se toma de lista de precios vigente, no se captura manualmente
  ventas:{l:'Ventas',f:['sku','name','qty','precio','total'],h:['SKU','Producto','Cant.','Precio','Total'],a:['sku','name','qty']},
  compras:{l:'Compras',f:['factura','ordenCompra','sku','name','qty','costo','total'],h:['Factura','OC','SKU','Producto','Cant.','Costo','Total'],a:['sku','name','qty']},
  devoluciones:{l:'Devoluciones',f:['sku','name','qty','motivo'],h:['SKU','Producto','Cant.','Motivo'],a:['sku','name','qty','motivo']},
  mermas:{l:'Mermas',f:['sku','name','qty','motivo'],h:['SKU','Producto','Cant.','Motivo'],a:['sku','name','qty','motivo']},
  cargas:{l:'Cargas',f:['sku','name','qty'],h:['SKU','Producto','Cant.'],a:['sku','name','qty']},
  nocargado:{l:'No cargado',f:['sku','name','qty'],h:['SKU','Producto','Cant.'],a:['sku','name','qty']},
  ajustes:{l:'Ajustes',f:['sku','name','qty_antes','qty_despues','diff','motivo','hora'],h:['SKU','Producto','Antes','Después','Dif.','Motivo','Hora'],a:['sku','name','qty_antes','qty_despues','motivo']},
};
const FL={folio:'Folio',sku:'SKU',name:'Producto',qty:'Cantidad',precio:'Precio unitario',motivo:'Motivo',costo:'Costo unitario',qty_antes:'Cantidad anterior',qty_despues:'Cantidad nueva'};
const NUM=['qty','precio','costo','qty_antes','qty_despues'];

let comprasAgrupar=true; // default: grouped by factura

function rMov(mod,C,A){
  const d=ensD();const cfg=MC[mod];const rows=d[mod]||[];
  const tQ=rows.reduce((a,r)=>a+Number(r.qty||0),0);
  const tV=rows.reduce((a,r)=>a+Number(r.total||0),0);

  const groupToggle=mod==='compras'?`
    <div class="vt">
      <button class="vb ${comprasAgrupar?'active':''}" onclick="comprasAgrupar=true;rPage('compras')">Por factura</button>
      <button class="vb ${!comprasAgrupar?'active':''}" onclick="comprasAgrupar=false;rPage('compras')">Todas juntas</button>
    </div>`:'';

  const MODS_CONFIRMAR=['ventas','cargas','devoluciones','mermas','nocargado'];
  const dMov=ensD();
  const movConfirmado=MODS_CONFIRMAR.includes(mod)&&dMov['conf_'+mod];
  const bloqMov=movConfirmado||dMov.cerrado;

  A.innerHTML=`${dnH()}${groupToggle}
    ${!bloqMov?`<button class="btn" onclick="openImp('${mod}')">&#8679; Importar Excel</button>`:''}
    ${mod==='compras'?`<button class="btn" onclick="openXMLReader()">&#128196; Leer XML factura</button>`:''}
    ${!bloqMov?`<button class="btn p" onclick="openAdd('${mod}')">+ Agregar</button>`:''}
    ${MODS_CONFIRMAR.includes(mod)&&!dMov.cerrado?
      movConfirmado
        ?`<span class="badge ok" style="padding:6px 16px;font-size:13px">&#10003; ${(mod==='ventas'?'Ventas':mod==='cargas'?'Cargas':mod==='devoluciones'?'Devoluciones':mod==='mermas'?'Mermas':'No cargado')} confirmadas</span>`
        :`<button class="btn s" onclick="confirmarMov('${mod}')">&#10003; Confirmar ${mod==='ventas'?'ventas':mod==='cargas'?'cargas':mod==='devoluciones'?'devoluciones':mod==='mermas'?'mermas':'no cargado'}</button>`
      :''}`;

  // Stats
  const stats=(mod==='ventas'||mod==='compras')
    ?`<div class="sr"><div class="sc"><div class="sl">Registros hoy</div><div class="sv">${rows.length}</div></div><div class="sc"><div class="sl">Unidades</div><div class="sv">${tQ}</div></div><div class="sc"><div class="sl">Total</div><div class="sv">$${f2(tV)}</div></div><div class="sc"><div class="sl">Prom.</div><div class="sv">$${rows.length?f2(tV/rows.length):'0.00'}</div></div></div>`
    :`<div class="sr" style="grid-template-columns:1fr 1fr"><div class="sc"><div class="sl">Registros hoy</div><div class="sv">${rows.length}</div></div><div class="sc"><div class="sl">Unidades</div><div class="sv">${tQ}</div></div></div>`;

  // Row renderer
  const renderRow=r=>`<tr>${cfg.f.map(f=>`<td>${f==='diff'?`<span class="${Number(r[f])>=0?'dp':'dn2'}">${Number(r[f])>=0?'+':''}${r[f]}</span>`:['costo','total','precio'].includes(f)&&r[f]!==undefined&&r[f]!=='-'?'$'+f2(r[f]):(r[f]??'-')}</td>`).join('')}<td><button class="btn sm" onclick="openEdit('${mod}','${r.id}')">Editar</button></td></tr>`;

  let body='';
  if(rows.length===0){
    body=`<div class="tw"><div class="es">Sin registros para ${fmtDd(curDate)}</div></div>`;
  } else if(mod==='compras'&&comprasAgrupar){
    // Group by factura
    const grupos={};
    rows.forEach(r=>{
      const key=r.factura||'Sin factura';
      if(!grupos[key])grupos[key]=[];
      grupos[key].push(r);
    });
    const facturas=Object.keys(grupos);
    body=facturas.map(fac=>{
      const gRows=grupos[fac];
      const gQty=gRows.reduce((a,r)=>a+Number(r.qty||0),0);
      const gTot=gRows.reduce((a,r)=>a+Number(r.total||0),0);
      const facEsc=fac.replace(/'/g,"\\'");
      const canDelete=!dMov.cerrado;
      return `<div style="margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;padding:8px 14px;background:var(--bg2);border-radius:var(--r);border-left:3px solid var(--blue)">
          <span style="font-weight:600;color:var(--blue)">&#128196; ${fac}</span>
          <span style="font-size:12px;color:var(--tx2)">${gRows.length} concepto(s)</span>
          <span style="font-size:12px;color:var(--tx2)">${gQty} unidades</span>
          <span style="font-size:12px;font-weight:500;margin-left:auto">Total: $${f2(gTot)}</span>
          ${canDelete?`<button class="btn sm" style="color:var(--red)" onclick="eliminarFactura('${facEsc}')">🗑 Eliminar factura</button>`:''}
        </div>
        <div class="tw"><table>
          <thead><tr>${cfg.h.map(h=>`<th>${h}</th>`).join('')}<th>Acción</th></tr></thead>
          <tbody>${gRows.map(renderRow).join('')}</tbody>
        </table></div>
      </div>`;
    }).join('');
  } else {
    body=`<div class="tw"><table><thead><tr>${cfg.h.map(h=>`<th>${h}</th>`).join('')}<th>Acción</th></tr></thead><tbody>${rows.map(renderRow).join('')}</tbody></table></div>`;
  }
  C.innerHTML=stats+body;
}

function openAdd(mod){
  const d=ensD();
  if(d.cerrado){
    toast(`❌ El día ${fmtDd(curDate)} está cerrado. El administrador debe reabrirlo para agregar registros.`);
    return;
  }
  const MODS_CONF=['ventas','cargas','devoluciones','mermas','nocargado'];
  if(MODS_CONF.includes(mod)&&d['conf_'+mod]){
    toast(`❌ Los registros de ${mod} ya fueron confirmados. No se pueden agregar más.`);
    return;
  }
  const cfg=MC[mod];
  const body=cfg.a.map(f=>`<div class="fg"><label>${FL[f]||f}</label>${f==='sku'?`<select id="af-${f}" onchange="fillN(this,'af','${mod}')">${PRODS.map(p=>`<option value="${p.sku}">${p.sku} — ${p.name}</option>`).join('')}</select>`:`<input id="af-${f}" type="${NUM.includes(f)?'number':'text'}" placeholder="${FL[f]||f}">`}</div>`).join('');
  // For ventas: show info that precio comes from price list
  const extra=mod==='ventas'?`<div style="font-size:12px;color:var(--blue);background:var(--blue-bg);padding:8px 12px;border-radius:var(--r);margin-top:4px">El precio se toma automáticamente de la lista de precios de venta vigente.</div>`
    :mod==='compras'?`<div style="font-size:12px;color:var(--blue);background:var(--blue-bg);padding:8px 12px;border-radius:var(--r);margin-top:4px">El costo se toma automáticamente de la lista de precios de compra vigente.</div>`:'';
  showMod(`Nuevo — ${cfg.l}`,body+extra,`<button class="btn" onclick="closeMod()">Cancelar</button><button class="btn p" onclick="saveAdd('${mod}')">Guardar</button>`);
  setTimeout(()=>{
    const s=document.getElementById('af-sku');if(s)fillN(s,'af',mod);

  },40);
}
function fillN(sel,pre,mod){
  const p=PRODS.find(x=>x.sku===sel.value);
  const n=document.getElementById(pre+'-name');if(n&&p)n.value=p.name;
  // precio se inyecta desde lista de precios, no desde input
  const ce=document.getElementById(pre+'-costo');if(ce)ce.value=activeC()?.precios[sel.value]||'';
}
function saveAdd(mod){
  const cfg=MC[mod];const row={id:uid()};
  cfg.a.forEach(f=>{const el=document.getElementById('af-'+f);if(el)row[f]=NUM.includes(f)?Number(el.value):el.value});
  // Auto-inject precio from active price list for ventas
  if(mod==='ventas'){
    const pv=activeV()?.precios[row.sku];
    if(pv){row.precio=pv;row.total=Number(row.qty)*pv;}
  }
  // Auto-inject costo from active price list for compras
  if(mod==='compras'){
    const pc=activeC()?.precios[row.sku];
    if(pc){row.costo=pc;row.total=Number(row.qty)*pc;}
  }
  if(row.qty_antes!==undefined&&row.qty_despues!==undefined)row.diff=row.qty_despues-row.qty_antes;
  const d=ensD();if(!d[mod])d[mod]=[];d[mod].push(row);
  addLog(mod,'Nuevo registro',`${mod}: SKU ${row.sku||''} — cantidad ${row.qty||row.diff||''}`);
  saveDD();closeMod();rPage(curPage);toast('Registro guardado');
}
function openEdit(mod,id){
  const d=ensD();
  if(d.cerrado){
    toast(`❌ El día ${fmtDd(curDate)} está cerrado. El administrador debe reabrirlo para editar registros.`);
    return;
  }
  const row=(d[mod]||[]).find(r=>r.id===id);if(!row)return;
  const cfg=MC[mod];
  // For edit, show all fields except folio; precio read-only for ventas
  const body=cfg.a.map(f=>`<div class="fg"><label>${FL[f]||f}</label><input id="ef-${f}" type="${NUM.includes(f)?'number':'text'}" value="${row[f]??''}"></div>`).join('');
  const extra=mod==='ventas'?`<div style="font-size:12px;color:var(--blue);background:var(--blue-bg);padding:8px 12px;border-radius:var(--r);margin-top:4px">Precio vigente de lista: $${f2(activeV()?.precios[row.sku]||0)}</div>`
    :mod==='compras'?`<div style="font-size:12px;color:var(--blue);background:var(--blue-bg);padding:8px 12px;border-radius:var(--r);margin-top:4px">Costo vigente de lista: $${f2(activeC()?.precios[row.sku]||0)}</div>`:'';
  showMod(`Editar — ${cfg.l}`,body+extra,`<button class="btn" onclick="closeMod()">Cancelar</button><button class="btn p" onclick="saveEdit('${mod}','${id}')">Actualizar</button>`);
}
function saveEdit(mod,id){
  const d=ensD();const row=(d[mod]||[]).find(r=>r.id===id);if(!row)return;
  MC[mod].a.forEach(f=>{const el=document.getElementById('ef-'+f);if(el)row[f]=NUM.includes(f)?Number(el.value):el.value});
  if(mod==='ventas'){const pv=activeV()?.precios[row.sku];if(pv){row.precio=pv;row.total=Number(row.qty)*pv;}}
  if(mod==='compras'){
    const pc=activeC()?.precios[row.sku];
    if(pc){row.costo=pc;row.total=Number(row.qty)*pc;}
  }
  if(row.qty_antes!==undefined&&row.qty_despues!==undefined)row.diff=row.qty_despues-row.qty_antes;
  addLog(mod,'Actualizado',`${mod}: SKU ${row.sku||''}`);
  saveDD();closeMod();rPage(curPage);toast('Actualizado');
}

  C.innerHTML=stats+body;

  const cuerpo=lines.slice(1).filter(l=>l.trim()).map(l=>`<p style="font-size:13px;color:var(--tx2);margin:4px 0">${l}</p>`).join('');

function rInv(C,A){
  const d=ensD();const cerrado=d.cerrado||false;

  const contados=PRODS.filter(p=>piso[p.sku]!==undefined).length;

  A.innerHTML=`${dnH()}
    <button class="btn" onclick="nav('conteos')">🔢 Ir a Conteos</button>

      <button class="btn" style="color:var(--blue);border-color:var(--blue)" onclick="reenviarHistorial()" title="Reenviar movimientos del día al historial (Reportes)">&#8679; Reenviar historial</button>

    `}`;

  const rows=PRODS.map(p=>{
    const sm=mod=>(d[mod]||[]).filter(r=>String(r.sku)===String(p.sku)).reduce((a,r)=>a+Number(r.qty||0),0);
    const c=sm('compras'),dv=sm('devoluciones'),v=sm('ventas'),ca=sm('cargas'),m=sm('mermas');
    const ent=c+dv,sal=v+ca+m;
    // Use stockInicial saved at close time for closed days, otherwise use current p.stock
    const stockBase=d.stockInicial?.[p.sku]!==undefined?d.stockInicial[p.sku]:p.stock;
    const teo=stockBase+ent-sal;
    const pisoVal=piso[String(p.sku)];
    const tieneConteo=pisoVal!==undefined;
    // Pte. Liquidar — use snapshot for closed days so past values don't change
    const pteSource=cerrado&&d.pteLiquidarSnapshot?d.pteLiquidarSnapshot:PTE_LIQUIDAR;
    const cd=curDate;
    const fechaDia=cd.getFullYear()+'-'+String(cd.getMonth()+1).padStart(2,'0')+'-'+String(cd.getDate()).padStart(2,'0');
    const pteEntry=pteSource.find(x=>String(x.sku)===String(p.sku)&&(!x.fechaAlta||x.fechaAlta<=fechaDia));
    // Sum all entries for same SKU in case duplicates exist in localStorage
    const pteAll=pteSource.filter(x=>String(x.sku)===String(p.sku)&&(!x.fechaAlta||x.fechaAlta<=fechaDia));
    const pte=pteAll.length>0?pteAll.reduce((a,x)=>a+Number(x.qty||0),0):null;
    // Inv. final = Conteo + Pte. Liquidar + Cargas
    const invFinal=tieneConteo?(pisoVal+(pte||0)+ca):null;
    // Diferencia = (Conteo + Pte. Liquidar) - Teórico  (sin cargas, son el ajuste real)
    const diff=tieneConteo?(pisoVal+(pte||0))-teo:null;
    return {p,c,dv,v,ca,m,ent,sal,teo,pisoVal,tieneConteo,diff,pte,stockBase,invFinal};
  });

  // Inventory valuation: sum of (invFinal * precio compra vigente) for all products
  const ac=activeC();
  const valorTotal=rows.reduce((sum,r)=>{
    const qty=r.invFinal!==null?r.invFinal:r.stockBase;
    const costo=ac?.precios[r.p.sku]||ac?.precios[String(r.p.sku)]||0;
    return sum+(qty*costo);
  },0);
  const valorContado=rows.reduce((sum,r)=>{
    if(!r.tieneConteo) return sum;
    const qty=r.invFinal!==null?r.invFinal:0;
    const costo=ac?.precios[r.p.sku]||ac?.precios[String(r.p.sku)]||0;
    return sum+(qty*costo);

  const skusConPrecio=rows.filter(r=>ac?.precios[r.p.sku]||ac?.precios[String(r.p.sku)]).length;

  // Summary bar

      <div style="font-size:11px;color:var(--tx3);margin-top:2px">Con conteo capturado</div>
    </div>
    <div class="sc">
      <div class="sl">Valoración Teórica</div>
      <div class="sv" style="color:var(--tx);font-size:18px">$${f2(valorTotal)}</div>
      <div style="font-size:11px;color:var(--tx3);margin-top:2px">${skusConPrecio} SKUs con precio</div>
    </div>
    <div class="sc">
      <div class="sl">Lista de precios</div>
      <div class="sv" style="font-size:13px;color:${ac?'var(--green)':'var(--red)'}">
        ${ac?ac.nombre:'Sin lista activa'}
      </div>
      <div style="font-size:11px;color:var(--tx3);margin-top:2px">${ac?'Desde '+fmtD(ac.fechaInicio):'Configura en Lista de precios'}</div>
    </div>
  </div>
  <div style="background:var(--blue-bg);color:var(--blue);border-radius:var(--r);padding:8px 14px;font-size:12px;margin-bottom:14px">
    &#8505;&#65039; Los conteos se capturan en el módulo <strong>Conteos</strong>.
    ${pendientes>0
      ?`<strong style="color:var(--amber)"> ${pendientes} SKU(s) pendientes de contar.</strong>`
      :`<strong style="color:var(--green)"> &#10003; Todos los SKUs contados.</strong>`}
  </div>`;

  C.innerHTML=resumen+`
    <div style="margin-bottom:12px">
      <input id="inv-search" type="text" placeholder="🔍 Buscar por SKU o nombre de producto..."

    <div class="itw"><table class="it"><thead>

    <th colspan="3" style="text-align:center;background:var(--green-bg);color:var(--green)">Entradas</th>
    <th colspan="3" style="text-align:center;background:var(--red-bg);color:var(--red)">Salidas</th>
    <th rowspan="2">Teórico</th><th rowspan="2">Conteo</th>
    <th rowspan="2" style="background:var(--amber-bg);color:var(--amber)">Pte. Liquidar</th>
    <th rowspan="2" style="background:var(--green-bg);color:var(--green)">Inv. Final</th>
    <th rowspan="2">Diferencia</th></tr>
    <tr><th>Compras</th><th>Devoluciones</th><th>Total</th><th>Ventas</th><th>Cargas</th><th>Mermas</th></tr>
    </thead><tbody>${rows.map(r=>`<tr>
      <td><strong>${r.p.sku}</strong></td><td>${r.p.name}</td><td>${r.stockBase}</td>
      <td>${r.c||'-'}</td><td>${r.dv||'-'}</td><td class="tot">${r.ent||'-'}</td>
      <td>${r.v||'-'}</td><td>${r.ca||'-'}</td><td>${r.m||'-'}</td>
      <td class="tot"><strong>${r.teo}</strong></td>
      <td>${r.tieneConteo
        ?`<strong>${r.pisoVal}</strong> <span style="font-size:10px;color:var(--green)">&#10003;</span>`
        :`<span style="color:var(--tx3);font-size:12px">Sin conteo</span>`}
      </td>
      <td style="color:var(--amber);font-weight:500">${r.pte!==null?r.pte:'-'}</td>
      <td style="color:var(--green);font-weight:600">${r.invFinal!==null?`<strong>${r.invFinal}</strong>`:'<span style="color:var(--tx3);font-size:12px">Sin conteo</span>'}</td>
      <td id="dc-${r.p.sku}">${r.diff!==null

        :'-'}
      </td>
    </tr>`).join('')}
    ${(()=>{
      const T=(f)=>rows.reduce((a,r)=>a+Number(r[f]||0),0);
      const totC=T('c'),totDv=T('dv'),totEnt=T('ent');
      const totV=T('v'),totCa=T('ca'),totM=T('m');
      const totBase=rows.reduce((a,r)=>a+Number(r.stockBase||0),0);
      const totTeo=rows.reduce((a,r)=>a+Number(r.teo||0),0);

function ejecutarCierreDia(){
  const d=ensD();
  let count=0;
  const fecha=ds();
  if(!d.stockInicial) d.stockInicial={};
  PRODS.forEach(p=>{ d.stockInicial[p.sku]=p.stock; });

  PRODS.forEach(p=>{
    const piso=d.piso?.[String(p.sku)];
    if(piso===undefined)return;
    const sm=mod=>(d[mod]||[]).filter(r=>String(r.sku)===String(p.sku)).reduce((a,r)=>a+Number(r.qty||0),0);
    const teo=p.stock+sm('compras')+sm('devoluciones')-sm('ventas')-sm('cargas')-sm('mermas');
    const pteEntry=PTE_LIQUIDAR.find(x=>String(x.sku)===String(p.sku)&&(!x.fechaAlta||x.fechaAlta<=fecha));
    const pte=pteEntry?Number(pteEntry.qty):0;
    const cargas=sm('cargas');
    const invFinal=piso+pte+cargas;
    // diff = (conteo + pte) - teórico, sin incluir cargas (consistente con columna Diferencia de la vista)
    const diff=(piso+pte)-teo;
    if(diff!==0){
      if(!d.ajustes)d.ajustes=[];
      d.ajustes.push({id:uid(),sku:p.sku,name:p.name,qty_antes:teo,qty_despues:invFinal,diff,
        motivo:'Cierre de día — diferencia inventario físico vs teórico',
        hora:new Date().toTimeString().slice(0,5),fecha});
      count++;
    }
    p.stock=invFinal;
  });
  // Save snapshot of PTE_LIQUIDAR so past days show values as they were at close time
  d.pteLiquidarSnapshot=PTE_LIQUIDAR.map(r=>({...r}));
  d.cerrado=true;
  addLog('inv','Cierre de día',`Día ${fecha} cerrado — ${count} ajuste(s) generados`);
  saveDD();saveProds();
  // Guardar movimientos del día en historial (tabla movimientos en BD)
  guardarMovimientosCierre(fecha, d);
  curDate=new Date(curDate);curDate.setDate(curDate.getDate()+1);
  rPage('inv');
  toast(count>0?`✓ Día cerrado — ${count} ajuste(s) enviados a Ajustes`:'✓ Día cerrado — sin diferencias');
}

async function guardarMovimientosCierre(fecha, d, silencioso=false){
  // Mapeo módulo → tipo en BD
  const MODS=[
    {mod:'ventas',    tipo:'venta',      folioF:'folio'},
    {mod:'compras',   tipo:'compra',     folioF:'factura', grupoF:'ordenCompra'},
    {mod:'devoluciones',tipo:'devolucion',folioF:'motivo'},
    {mod:'mermas',    tipo:'merma',      folioF:'motivo'},
    {mod:'cargas',    tipo:'carga',      folioF:'folio'},
    {mod:'nocargado', tipo:'nocargado',  folioF:'folio'},
    {mod:'ajustes',   tipo:'ajuste',     folioF:'motivo'},
  ];
  let errores=0, guardados=0;
  for(const {mod,tipo,folioF,grupoF} of MODS){
    const items=(d[mod]||[]).map(r=>({
      sku: r.sku,
      cantidad: mod==='ajustes' ? Number(r.diff||0) : Number(r.qty||r.qty_despues||0),
      folio: r[folioF]||null,
      costo: r.costo||null,
      grupo_importacion: grupoF?r[grupoF]||null:null,
    }));
    if(items.length===0) continue;
    try{
      await apiFetch('/api/movimientos/batch',{
        method:'POST',
        body:JSON.stringify({fecha, tipo, items, confirmado:true})
      });
      guardados++;
    }catch(e){
      console.warn('No se pudo guardar historial de',mod,e.message);
      errores++;
    }
  }
  if(!silencioso){
    if(errores>0 && guardados===0) toast('⚠ No se pudo guardar el historial. Usa "Reenviar historial" después.');
    else if(errores>0) toast(`⚠ Historial parcial guardado (${errores} módulo(s) fallaron).`);
  }
  return {guardados, errores};
}

async function reenviarHistorial(){
  const fecha=fmtDd(curDate);
  const d=DD[fecha];
  if(!d||!d.cerrado){toast('Este día no está cerrado');return;}
  toast('Guardando historial...');
  const {guardados,errores}=await guardarMovimientosCierre(fecha, d, true);
  if(errores===0) toast(`✓ Historial guardado correctamente (${guardados} módulo(s))`);
  else if(guardados===0) toast('⚠ Error al guardar. Verifica tu sesión e intenta de nuevo.');
  else toast(`⚠ Parcial: ${guardados} guardados, ${errores} fallaron.`);
}

// Calculate average daily consumption for a SKU over last N days
function avgDiario(sku, dias30){
  const hoy=new Date(curDate);
  let totalSalidas=0;
  let diasConDatos=0;
  for(let i=0;i<dias30;i++){
    const d=new Date(hoy);d.setDate(d.getDate()-i);
    const key=d.toISOString().split('T')[0];
    const day=DD[key];
    if(!day) continue;
    const sal=['ventas','cargas','mermas'].reduce((a,mod)=>
      a+(day[mod]||[]).filter(r=>r.sku===sku).reduce((s,r)=>s+Number(r.qty||0),0),0);
    if(sal>0){totalSalidas+=sal;diasConDatos++;}
  }
  if(diasConDatos===0) return 0;
  return totalSalidas/dias30; // promedio sobre los 30 días (no solo días con datos)
}

const MAX_TARIMAS_TRAILER = 52;
let trailerPlan = []; // [{id, label, items:[{sku,name,tarimas,diasExistencia}]}]


function abrirPlanTrailerDesdeTabla(){
  // Read tarimas from visible editable inputs in the pedido table
  const rows=document.querySelectorAll('.it tbody tr');
  const candidatos=[];
  rows.forEach(row=>{
    if(row.style.display==='none') return; // skip filtered rows
    const tds=row.querySelectorAll('td');
    if(tds.length<9) return;
    const sku=tds[0]?.textContent?.trim();
    const name=tds[1]?.textContent?.trim();
    const tarimasInput=tds[9]?.querySelector('input');
    const paqInput=tds[10]?.querySelector('input');
    const tarimasNec=tarimasInput?Number(tarimasInput.value):0;
    const paqNec=paqInput?Number(paqInput.value):0;
    if(tarimasNec<=0&&paqNec<=0) return;
    const p=PRODS.find(x=>String(x.sku)===String(sku));
    const prom=p?avgDiario(p.sku,30):0;
    const diasEx=p&&prom>0?Math.floor(p.stock/prom):9999;
    candidatos.push({sku,name,tarimasNec,paqNec,diasEx,restante:tarimasNec,prom});
  });
  if(candidatos.length===0){
    toast('Sin productos con tarimas en la tabla. Asegúrate de tener Cajas/Tarima configurado en productos.');
    return;
  }
  // Sort by urgency
  candidatos.sort((a,b)=>a.diasEx-b.diasEx);
  // Distribute into trailers
  trailerPlan=[];
  let pending=[...candidatos];
  let trailerNum=1;
  while(pending.some(p=>p.restante>0)){
    const trailer={id:trailerNum,label:`Trailer ${trailerNum}`,items:[],total:0};
    let cap=MAX_TARIMAS_TRAILER;
    for(const prod of pending){
      if(prod.restante<=0||cap<=0) continue;
      const tomar=Math.min(prod.restante,cap);
      if(tomar>0){
        trailer.items.push({sku:prod.sku,name:prod.name,tarimas:tomar,paquetes:prod.paqNec||0,diasEx:prod.diasEx,restante:prod.restante-tomar});
        trailer.total+=tomar;
        prod.restante-=tomar;
        cap-=tomar;
      }
    }
    trailerPlan.push(trailer);
    trailerNum++;
    if(trailerNum>20) break;
  }
  renderTrailerModal();
}

function abrirPlanTrailer(){
  // Build candidates: products with pending order > 0, sorted by dias en existencia ASC (urgentes primero)
  const VENTANA=30;
  const candidatos=PRODS.map(p=>{
    const prom=avgDiario(p.sku,VENTANA);
    const dias=p._dias??7;
    const ped=Math.max(0,Math.ceil(prom*dias-p.stock));
    const tar=p.tarima||0;
    // Read from editable input if available
    const inputEl=document.getElementById('tarimas-input-'+p.sku);
    const tarimasNec=inputEl?Number(inputEl.value):(tar>0?Math.ceil(ped/tar):0);
    const diasEx=prom>0?Math.floor(p.stock/prom):9999;
    return {sku:p.sku,name:p.name,prom,dias,ped,tarima:tar,tarimasNec,diasEx};
  }).filter(r=>r.tarimasNec>0)
    .sort((a,b)=>a.diasEx-b.diasEx); // urgentes primero

  if(candidatos.length===0){
    toast('Sin productos con tarimas pendientes — configura Cajas/Tarima en productos');
    return;
  }

  // Auto-distribute into trailers of 52 tarimas
  trailerPlan=[];
  let pending=[...candidatos.map(c=>({...c,restante:c.tarimasNec}))];
  let trailerNum=1;
  while(pending.some(p=>p.restante>0)){
    const trailer={id:trailerNum,label:`Trailer ${trailerNum}`,items:[],total:0};
    let cap=MAX_TARIMAS_TRAILER;
    // Fill by priority (already sorted by urgency)
    for(const prod of pending){
      if(prod.restante<=0||cap<=0) continue;
      const tomar=Math.min(prod.restante,cap);
      if(tomar>0){
        trailer.items.push({sku:prod.sku,name:prod.name,tarimas:tomar,diasEx:prod.diasEx,restante:prod.restante-tomar});
        trailer.total+=tomar;
        prod.restante-=tomar;
        cap-=tomar;
      }
    }
    trailerPlan.push(trailer);
    trailerNum++;
    if(trailerNum>20) break; // safety
  }

  renderTrailerModal();
}

function editarPaqTrailer(tid,idx,val){
  const t=trailerPlan.find(x=>x.id===tid);if(!t)return;
  t.items[idx].paquetes=Number(val);

function editarTarimaTrailer(tid,idx,val){
  const t=trailerPlan.find(x=>x.id===tid);if(!t)return;
  t.items[idx].tarimas=Number(val);
  t.total=t.items.reduce((a,i)=>a+i.tarimas,0);
  // Refresh tab badge
  const tab=document.getElementById('ttab-'+tid);
  if(tab){const b=tab.querySelector('.badge');if(b)b.textContent=`${t.total}/${MAX_TARIMAS_TRAILER} tar.`;}
  const libre=MAX_TARIMAS_TRAILER-t.total;
  const span=document.querySelector('#trailer-detail span.badge');
  if(span)span.textContent=`${t.total}/${MAX_TARIMAS_TRAILER} tarimas`;
}

function quitarDeTrailer(tid,idx){
  const t=trailerPlan.find(x=>x.id===tid);if(!t)return;
  t.items.splice(idx,1);
  t.total=t.items.reduce((a,i)=>a+i.tarimas,0);
  selectTrailer(tid);
  const tab=document.getElementById('ttab-'+tid);
  if(tab){const b=tab.querySelector('.badge');if(b)b.textContent=`${t.total}/${MAX_TARIMAS_TRAILER} tar.`;}
}

  if(!sku){toast('Selecciona un producto');return}
  const p=PRODS.find(x=>x.sku===sku);
  const prom=avgDiario(sku,30);
  const diasEx=prom>0?Math.floor(p.stock/prom):9999;
  t.items.push({sku,name:p.name,tarimas:tar,paquetes:paq,diasEx});

function generarPedido(){
  // Read directly from the visible table — respects manual edits
  const tableRows=document.querySelectorAll('.it tbody tr');
  const filas=[];
  tableRows.forEach(row=>{
    if(row.style.display==='none') return;
    const tds=row.querySelectorAll('td');
    if(tds.length<10) return;
    // Col indices: 0=SKU,1=Producto,2=Empaque,3=Cajas/Tarima,4=Existencia,
    //              5=Consumo,6=DiasExistencia,7=DiasInventario(input),
    //              8=PedidoSugerido,9=Tarimas(input),10=Paquetes(input)
    const sku=tds[0]?.textContent?.trim();
    const name=tds[1]?.textContent?.trim();
    const emp=tds[2]?.textContent?.trim();
    const tar=tds[3]?.textContent?.trim();
    const stock=tds[4]?.textContent?.trim();
    const prom=tds[5]?.textContent?.trim();
    const diasInput=tds[7]?.querySelector('input');
    const dias=diasInput?diasInput.value:tds[7]?.textContent?.trim();
    const ped=tds[8]?.textContent?.trim();
    const tarimasInput=tds[9]?.querySelector('input');
    const tarimas=tarimasInput?tarimasInput.value:'0';
    const paqInput=tds[10]?.querySelector('input');
    const paquetes=paqInput?paqInput.value:'0';
    // Only include rows where user explicitly set tarimas OR paquetes > 0
    // Do NOT include based on calculated ped alone — user may have zeroed it out
    if(Number(tarimas)>0||Number(paquetes)>0)
      filas.push({sku,name,stock,empaque:emp,tarima:tar,prom,dias,ped,tarimas,paquetes});
  });

  if(filas.length===0){
    toast('Sin productos con tarimas o pedido — ajusta los días de inventario o las tarimas necesarias');
    return;
  }

  const rows=filas.map(r=>`<tr>
    <td><strong>${r.sku}</strong></td>
    <td>${r.name}</td>
    <td style="text-align:center">${r.empaque||'—'}</td>
    <td style="text-align:center">${r.tarima||'—'}</td>
    <td>${r.prom}</td>
    <td>${r.dias} días</td>
    <td class="tot"><strong>${r.ped}</strong></td>
    <td style="text-align:center;font-weight:600;color:var(--blue)">${Number(r.tarimas)>0?r.tarimas:'—'}</td>
    <td style="text-align:center">${Number(r.paquetes)>0?r.paquetes:'—'}</td>
  </tr>`).join('');

  showMod('Pedido sugerido',`
    <p style="font-size:13px;color:var(--tx2);margin-bottom:14px">
      Fecha: <strong>${fmtDd(curDate)}</strong> &nbsp;|&nbsp;
      <strong>${filas.length}</strong> producto(s) &nbsp;|&nbsp;
      Promedio últimos <strong>30 días</strong>
    </p>
    <div class="tw" style="max-height:340px;overflow-y:auto;overflow-x:auto"><table style="min-width:700px">
      <thead><tr><th>SKU</th><th>Producto</th><th>Empaque</th><th>Cajas/Tarima</th><th>Consumo diario</th><th>Días inv.</th><th>Pedido</th><th>Tarimas</th><th>Paquetes</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="ma">
      <button class="btn" onclick="closeMod()">Cerrar</button>
      <button class="btn p" onclick="exportarPedidoCSV()">&#8681; Exportar CSV</button>
    </div>
  `,'');
}

function setDias(sku,val,input){
  const p=PRODS.find(x=>String(x.sku)===String(sku));if(p)p._dias=Number(val);
  const prom=avgDiario(sku,30);
  const ped=Math.max(0,Math.ceil(prom*Number(val)-(p?.stock||0)));
  const tar=p?.tarima||0;
  const emp=p?.empaque||0;
  const tarimasNec=tar>0?Math.ceil(ped/tar):null;
  const cajasNec=emp>0?Math.ceil(ped/emp):null;
  const tarimasCompletas=tar>0&&cajasNec!==null?Math.floor(cajasNec/tar):null;
  const paquetesRaw=tarimasCompletas!==null?(cajasNec-(tarimasCompletas*tar)):null;
  const minPaq=p?.minPaquetes||0;
  const paquetesNec=paquetesRaw===null?null:(minPaq===0?0:paquetesRaw>=minPaq?paquetesRaw:0);
  const row=input?.closest('tr');
  if(row){
    const tds=row.querySelectorAll('td');
    if(tds[8]) tds[8].innerHTML=`<strong>${ped}</strong>`;
    if(tds[9]) tds[9].innerHTML=`<input class="ei" type="number" min="0" value="${tarimasNec!==null?tarimasNec:0}" style="width:65px;text-align:center" title="Editable manualmente">`;
    if(tds[10]) tds[10].innerHTML=`<input class="ei" type="number" min="0" max="${tar||999}" value="${paquetesNec!==null?paquetesNec:0}" style="width:65px;text-align:center" title="Máx ${tar||999} cajas">`;
  }
}

const TIPO_BD={ventas:'venta',compras:'compra',devoluciones:'devolucion',mermas:'merma',cargas:'carga',nocargado:'nocargado',ajustes:'ajuste'};
let _rData=[];

// ══════════════════════════════════════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════════════════════════════════════
async function rDashboard(C,A){
  A.innerHTML='';
  const ac=activeC();
  const now=new Date();
  const mesStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');

  // Recopilar todos los días del mes actual
  const diasMes=Object.entries(DD).filter(([f])=>f.startsWith(mesStr)&&!DD[f].diaSaltado);

  // ── 1. Ventas acumuladas del mes por SKU ──────────────────────────────
  const ventasMes={};
  diasMes.forEach(([,d])=>{
    (d.ventas||[]).forEach(v=>{
      ventasMes[v.sku]=(ventasMes[v.sku]||0)+Number(v.qty||0);
    });
  });
  const top10ventas=Object.entries(ventasMes)
    .map(([sku,qty])=>({sku,qty,name:PRODS.find(p=>String(p.sku)===String(sku))?.name||sku}))
    .sort((a,b)=>b.qty-a.qty).slice(0,10);

  // ── 2. No cargado del mes por SKU ─────────────────────────────────────
  const nocargadoMes={};
  diasMes.forEach(([,d])=>{
    (d.nocargado||[]).forEach(v=>{
      nocargadoMes[v.sku]=(nocargadoMes[v.sku]||0)+Number(v.qty||0);
    });
  });
  const top10nocargado=Object.entries(nocargadoMes)
    .map(([sku,qty])=>({sku,qty,name:PRODS.find(p=>String(p.sku)===String(sku))?.name||sku}))
    .sort((a,b)=>b.qty-a.qty).slice(0,10);

  // ── 3 & 4. Ajustes y mermas del mes en dinero — desde BD (fuente única) ──
  const mesDesde=mesStr+'-01';
  const mesHasta=mesStr+'-31';
  let ajustesDinero=0, mermasDinero=0;
  try{
    const [rowsAj, rowsM] = await Promise.all([
      apiFetch(`/api/movimientos?tipo=ajuste&desde=${mesDesde}&hasta=${mesHasta}`),
      apiFetch(`/api/movimientos?tipo=merma&desde=${mesDesde}&hasta=${mesHasta}`)
    ]);
    rowsAj.forEach(r=>{
      const costo=ac?.precios[r.sku]||ac?.precios[String(r.sku)]||0;
      ajustesDinero+=Number(r.cantidad||0)*costo;
    });
    rowsM.forEach(r=>{
      const costo=ac?.precios[r.sku]||ac?.precios[String(r.sku)]||0;
      mermasDinero+=Number(r.cantidad||0)*costo;
    });
  }catch(e){ console.warn('Dashboard: error cargando ajustes/mermas de BD',e); }

  // ── 5. Valoración teórica actual ──────────────────────────────────────
  let valoracionTeorica=0;
  PRODS.forEach(p=>{
    const costo=ac?.precios[p.sku]||ac?.precios[String(p.sku)]||0;
    valoracionTeorica+=p.stock*costo;
  });

  // ── 6. Días de inventario por SKU ─────────────────────────────────────
  // Ventas promedio diario = total ventas mes / días con ventas
  const diasConVentas=diasMes.filter(([,d])=>(d.ventas||[]).length>0).length||1;
  const diasData=PRODS.filter(p=>p.stock>0).map(p=>{
    const vMes=ventasMes[String(p.sku)]||ventasMes[p.sku]||0;
    const promDia=vMes/diasConVentas;
    const dias=promDia>0?Math.round(p.stock/promDia):null;
    const costo=ac?.precios[p.sku]||0;
    return {sku:p.sku,name:p.name,stock:p.stock,dias,costo};
  }).filter(x=>x.dias!==null);

  const top10masDias=diasData.sort((a,b)=>b.dias-a.dias).slice(0,10);
  const top10menosDias=[...diasData].sort((a,b)=>a.dias-b.dias).slice(0,10);

  // ── 7. Órdenes pendientes ─────────────────────────────────────────────
  const ordenesPend=ORDENES.filter(o=>o.estado==='Pendiente');

  // ── Render ─────────────────────────────────────────────────────────────
  const kpiColor=(v,positivo)=>{
    if(v===0)return'var(--tx2)';
    return(positivo?v>0:v<0)?'var(--green)':'var(--red)';
  };

  const tablaTop=(rows,col)=>`
    <table style="width:100%;font-size:13px;border-collapse:collapse">
      <thead><tr style="color:var(--tx3);font-size:11px;text-transform:uppercase">
        <th style="text-align:left;padding:4px 0">Producto</th>
        <th style="text-align:right;padding:4px 0">${col}</th>
      </tr></thead>
      <tbody>${rows.map((r,i)=>`<tr style="border-top:1px solid var(--bd)">
        <td style="padding:5px 0;color:var(--tx1)"><span style="color:var(--tx3);margin-right:6px">${i+1}.</span>${r.name}</td>
        <td style="text-align:right;font-weight:600;color:var(--tx1)">${r.qty!==undefined?r.qty.toLocaleString('es-MX'):r.dias+' días'}</td>
      </tr>`).join('')}</tbody>
    </table>`;

  const card=(title,content,extra='')=>`
    <div style="background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:18px 20px;${extra}">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);margin-bottom:12px">${title}</div>
      ${content}
    </div>`;

  const kpiCard=(title,valor,sub='',color='var(--tx1)')=>`
    <div style="background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:18px 20px">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);margin-bottom:8px">${title}</div>
      <div style="font-size:26px;font-weight:700;color:${color}">${valor}</div>
      ${sub?`<div style="font-size:12px;color:var(--tx3);margin-top:4px">${sub}</div>`:''}
    </div>`;

  const fmt$=n=>'$'+Math.abs(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});

  C.innerHTML=`
    <div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));padding:4px 0">

      ${kpiCard('Valoración teórica inventario',fmt$(valoracionTeorica),
        ac?'A precio de compra vigente':'Sin lista de precios activa',
        'var(--blue)')}

      ${kpiCard('Ajustes del mes',
        (ajustesDinero>=0?'+':'')+fmt$(ajustesDinero).replace('$',ajustesDinero<0?'-$':'$'),
        diasMes.length+' días cerrados en el mes',
        ajustesDinero<0?'var(--red)':ajustesDinero>0?'var(--green)':'var(--tx2)')}

      ${kpiCard('Mermas del mes',
        '-'+fmt$(mermasDinero),
        'Pérdida registrada a precio de compra',
        mermasDinero>0?'var(--red)':'var(--tx2)')}

      ${kpiCard('OC pendientes de surtir',
        ordenesPend.length,
        ordenesPend.length===0?'Todo surtido':ordenesPend.map(o=>o.folio).join(', '),
        ordenesPend.length>0?'var(--amber)':'var(--green)')}

async function updR(){
  const mod=document.getElementById('rm')?.value||'ventas';
  const from=document.getElementById('rf1')?.value,to=document.getElementById('rf2')?.value;
  const el=document.getElementById('rr'), pv=document.getElementById('rr-pivot');
  if(!from||!to){if(el)el.innerHTML=`<div class="es">Selecciona fechas</div>`;return;}
  if(el)el.innerHTML=`<div class="es">Cargando...</div>`;
  if(pv)pv.innerHTML='';
  const tipo=TIPO_BD[mod]||mod;
  try{
    const rows=await apiFetch(`/api/movimientos?tipo=${tipo}&desde=${from}&hasta=${to}`);
    _rData=rows;

    // Días únicos ordenados
    const dias=[...new Set(_rData.map(r=>r.fecha))].sort();

    // Nombres de productos desde variable global PRODS
    const nomProd={};
    if(typeof PRODS!=='undefined'&&Array.isArray(PRODS)){
      PRODS.forEach(p=>{ nomProd[String(p.sku)]=p.name; });
    }

    // Pivot: {sku: {fecha: cantidad}}
    const pivot={};
    _rData.forEach(r=>{
      const sku=String(r.sku);
      if(!pivot[sku])pivot[sku]={};
      pivot[sku][r.fecha]=(pivot[sku][r.fecha]||0)+Number(r.cantidad||0);
    });

    const skusSorted=Object.keys(pivot).sort((a,b)=>Number(a)-Number(b));
    const fmtDia=d=>d.slice(8)+'/'+d.slice(5,7); // DD/MM

    // Totales por columna
    const totCol={};
    dias.forEach(d=>{
      totCol[d]=skusSorted.reduce((s,sku)=>s+(pivot[sku]?.[d]||0),0);
    });

    // Normalizar fechas a YYYY-MM-DD (quitar timestamp si viene con T...)
    const normFecha=f=>f?f.slice(0,10):f;
    const diasNorm=dias.map(normFecha);
    // Re-pivot con fechas normalizadas
    const pivot2={};
    _rData.forEach(r=>{
      const sku=String(r.sku), fd=normFecha(r.fecha);
      if(!pivot2[sku])pivot2[sku]={};
      pivot2[sku][fd]=(pivot2[sku][fd]||0)+Number(r.cantidad||0);
    });
    const totCol2={};
    diasNorm.forEach(d=>{
      totCol2[d]=skusSorted.reduce((s,sku)=>s+(pivot2[sku]?.[d]||0),0);
    });

    const thead=`<tr><th class="fix-hd" style="width:52px">SKU</th><th class="fix-hd">Producto</th>${diasNorm.map(d=>`<th class="day-hd">${fmtDia(d)}</th>`).join('')}<th class="tot-hd">Total</th></tr>`;

    const tbody=skusSorted.map(sku=>{
      let rowTotal=0;
      const cells=diasNorm.map(d=>{
        const v=pivot2[sku]?.[d]||0;
        rowTotal+=v;
        return `<td class="${v===0?'zero':''}">${v===0?'-':v.toLocaleString()}</td>`;
      }).join('');
      return `<tr><td class="sku-col">${sku}</td><td class="pname">${nomProd[sku]||'-'}</td>${cells}<td class="tot-col">${rowTotal.toLocaleString()}</td></tr>`;
    }).join('');

    const grandTotal=Object.values(totCol2).reduce((a,b)=>a+b,0);
    const totRow=`<tr class="total-row"><td class="sku-col"></td><td class="pname">TOTAL</td>${diasNorm.map(d=>`<td>${(totCol2[d]||0).toLocaleString()}</td>`).join('')}<td class="tot-col">${grandTotal.toLocaleString()}</td></tr>`;

    const totalUnidades=_rData.reduce((a,r)=>a+Number(r.cantidad||0),0);
    if(el)el.innerHTML=`<div class="sr" style="grid-template-columns:repeat(3,1fr);margin-bottom:8px">
      <div class="sc"><div class="sl">Registros</div><div class="sv">${_rData.length}</div></div>
      <div class="sc"><div class="sl">Total unidades</div><div class="sv">${totalUnidades.toLocaleString()}</div></div>
      <div class="sc"><div class="sl">Días</div><div class="sv">${dias.length}</div></div>
    </div>`;

    // Guardar datos para toggle dinero
    window._rPivot2=pivot2;
    window._rSkusSorted=skusSorted;
    window._rDiasNorm=diasNorm;
    window._rNomProd=nomProd;
    window._rMoneyMode=false;

    // Mostrar botón dinero solo cuando hay precio de compra disponible
    const moneyBtn=document.getElementById('rr-money-btn');
    if(moneyBtn) moneyBtn.style.display='';

    if(pv)pv.innerHTML=skusSorted.length===0
      ?`<div class="es">Sin datos para el rango seleccionado</div>`
      :`<table><thead>${thead}</thead><tbody>${tbody}${totRow}</tbody></table>`;
  }catch(e){console.error(e);if(el)el.innerHTML=`<div class="es">Error al cargar datos</div>`;}
}

function toggleRMoney(){
  const btn=document.getElementById('rr-money-btn');
  const pv=document.getElementById('rr-pivot');
  if(!pv||!window._rSkusSorted) return;

  window._rMoneyMode=!window._rMoneyMode;
  const money=window._rMoneyMode;
  btn.textContent=money?'🔢 Ver en unidades':'💲 Ver en dinero';
  btn.style.background=money?'var(--green)':'';
  btn.style.color=money?'#fff':'';
  btn.style.borderColor=money?'var(--green)':'';

  const ac=activeC();
  const pivot2=window._rPivot2, skusSorted=window._rSkusSorted;
  const diasNorm=window._rDiasNorm, nomProd=window._rNomProd;
  const fmtDia=d=>d.slice(8)+'/'+d.slice(5,7);
  const fmt$=n=>'$'+Math.abs(n).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:0});

  const costo=sku=>ac?.precios[sku]||ac?.precios[String(sku)]||0;

  const thead=`<tr><th class="fix-hd" style="width:52px">SKU</th><th class="fix-hd">Producto</th>${diasNorm.map(d=>`<th class="day-hd">${fmtDia(d)}</th>`).join('')}<th class="tot-hd">Total</th></tr>`;

  const totCol2={};
  diasNorm.forEach(d=>{ totCol2[d]=0; });

  const tbody=skusSorted.map(sku=>{
    const pc=costo(sku);
    let rowTotal=0;
    const cells=diasNorm.map(d=>{
      const qty=pivot2[sku]?.[d]||0;
      const val=money?qty*pc:qty;
      rowTotal+=val;
      totCol2[d]=(totCol2[d]||0)+val;
      if(val===0) return `<td class="zero">-</td>`;
      if(money){
        const neg=val<0;
        return `<td style="color:${neg?'var(--red)':'var(--green)'}">${neg?'-':''}${fmt$(val)}</td>`;
      }
      return `<td>${val.toLocaleString()}</td>`;
    }).join('');
    const totalFmt=money?(rowTotal<0?`<span style="color:var(--red)">-${fmt$(rowTotal)}</span>`:`<span style="color:var(--green)">${fmt$(rowTotal)}</span>`):rowTotal.toLocaleString();
    return `<tr><td class="sku-col">${sku}</td><td class="pname">${nomProd[sku]||'-'}</td>${cells}<td class="tot-col">${totalFmt}</td></tr>`;
  }).join('');

  const grandTotal=Object.values(totCol2).reduce((a,b)=>a+b,0);
  const totCells=diasNorm.map(d=>{
    const v=totCol2[d]||0;
    if(money) return `<td>${v<0?`-${fmt$(v)}`:fmt$(v)}</td>`;
    return `<td>${v.toLocaleString()}</td>`;
  }).join('');
  const grandFmt=money?(grandTotal<0?`-${fmt$(grandTotal)}`:fmt$(grandTotal)):grandTotal.toLocaleString();
  const totRow=`<tr class="total-row"><td class="sku-col"></td><td class="pname">TOTAL</td>${totCells}<td class="tot-col">${grandFmt}</td></tr>`;

  pv.innerHTML=`<table><thead>${thead}</thead><tbody>${tbody}${totRow}</tbody></table>`;
}

function exportRExcel(){
  if(!window._rSkusSorted||window._rSkusSorted.length===0){toast('Sin datos para exportar');return;}
  const mod=document.getElementById('rm')?.value||'reporte';
  const from=document.getElementById('rf1')?.value||'',to=document.getElementById('rf2')?.value||'';
  const money=window._rMoneyMode||false;
  const ac=activeC();
  const pivot2=window._rPivot2, skusSorted=window._rSkusSorted;
  const diasNorm=window._rDiasNorm, nomProd=window._rNomProd;
  const fmtDia=d=>d.slice(8)+'/'+d.slice(5,7);
  const costo=sku=>ac?.precios[sku]||ac?.precios[String(sku)]||0;
  const esc=v=>`"${String(v??'').replace(/"/g,'""')}"`;

  // Header: SKU, Producto, [días...], Total
  const header=[esc('SKU'),esc('Producto'),...diasNorm.map(d=>esc(fmtDia(d))),esc('Total')].join(',');

  const totCol={};
  diasNorm.forEach(d=>{ totCol[d]=0; });

  const rows=skusSorted.map(sku=>{
    const pc=costo(sku);
    let rowTotal=0;
    const cells=diasNorm.map(d=>{
      const qty=pivot2[sku]?.[d]||0;
      const val=money?qty*pc:qty;
      rowTotal+=val;
      totCol[d]=(totCol[d]||0)+val;
      return val===0?'':val;
    });
    return [esc(sku),esc(nomProd[sku]||sku),...cells.map(v=>esc(v)),esc(rowTotal)].join(',');
  });

  const grandTotal=Object.values(totCol).reduce((a,b)=>a+b,0);
  const totRow=[esc(''),esc('TOTAL'),...diasNorm.map(d=>esc(totCol[d]||0)),esc(grandTotal)].join(',');

  const suffix=money?'_dinero':'_unidades';
  const csv='﻿'+[header,...rows,totRow].join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`reporte_${mod}${suffix}_${from}_${to}.csv`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  toast('Archivo descargado');
}

    ${cerrado?`<span class="badge ok" style="padding:6px 16px;font-size:13px">&#10003; Día cerrado</span>`:''}`;

    <div class="sc"><div class="sl">Estado</div><div class="sv" style="font-size:13px;font-weight:500;color:${cerrado?'var(--green)':confirmado?'var(--blue)':pendientes>0?'var(--amber)':'var(--green)'}">

  if(d.cerrado){toast('El día ya está cerrado');return}
  if(d.conteoConfirmado){toast('El conteo ya fue confirmado y está bloqueado');return}
  const piso=d.piso||{};
  // Find first product without a conteo (check both string and number key)
  const pendiente=PRODS.find(p=>piso[String(p.sku)]===undefined&&piso[p.sku]===undefined)||PRODS[0];

function editConteo(sku){
  const d=ensD();
  if(d.cerrado){toast('El día ya está cerrado');return}
  if(d.conteoConfirmado){toast('El conteo ya fue confirmado y está bloqueado');return}
  const skuStr=String(sku);
  const valorActual=d.piso?.[skuStr]!==undefined?d.piso[skuStr]:'';
  const p=PRODS.find(x=>String(x.sku)===skuStr);
  if(!p){toast('Producto no encontrado');return}
  const idx=PRODS.indexOf(p);
  const siguiente=PRODS.slice(idx+1).find(x=>true); // next product
  showMod(`Conteo — ${p.name}`,`
    <p style="font-size:12px;color:var(--tx2);margin-bottom:6px">SKU: <strong>${p.sku}</strong>${p.ml?' &nbsp;|&nbsp; '+p.ml+' ml':''}</p>
    <div class="fg" style="margin-top:12px">
      <label style="font-size:15px;font-weight:500">Existencia física contada</label>
      <input id="conteo-val" type="number" min="0" value="${valorActual}" placeholder="0"
        style="font-size:24px;padding:12px;margin-top:8px;text-align:center;width:100%"
        onkeydown="if(event.key==='Enter')saveConteo('${skuStr}',${siguiente?`'${siguiente.sku}'`:'null'})">
    </div>
    <p style="font-size:11px;color:var(--tx3);margin-top:6px">Presiona Enter o "Guardar y continuar" para avanzar al siguiente SKU.</p>
  `,`
    <button class="btn" onclick="closeMod()">Cancelar</button>

      ?`<button class="btn" onclick="saveConteo('${skuStr}',null)">Guardar</button>
        <button class="btn p" onclick="saveConteo('${skuStr}','${siguiente.sku}')">Guardar y continuar &#8594;</button>`
      :`<button class="btn p" onclick="saveConteo('${skuStr}',null)">&#10003; Guardar último conteo</button>`}
  `);
  setTimeout(()=>{const el=document.getElementById('conteo-val');if(el){el.focus();el.select();}},60);
}

function saveConteo(sku, nextSku){
  const val=document.getElementById('conteo-val')?.value;
  if(val===''||val===null||val===undefined){toast('Ingresa un valor');return}
  const d=ensD();
  if(!d.piso)d.piso={};
  const num=Number(val);
  // Store with string key only for consistency
  d.piso[String(sku)]=num;
  addLog('conteos','Conteo capturado',`SKU ${sku}: ${val} unidades — ${fmtDd(curDate)}`);
  saveDD();
  if(nextSku&&nextSku!=='null'){
    closeMod();
    editConteo(nextSku);
  } else {
    closeMod();
    rPage('conteos');
    toast('Conteo guardado');
  }
}



// ── Equivalencias XML ──────────────────────────────────────────────────────
// Persistent map: codigoXML -> {sku, descripcionXML, asignadoEn}
// ── Equivalencias XML — persistent storage ─────────────────────────────────
// Stored in localStorage so they survive page reloads and browser sessions.
// Key: 'inventapro_equiv_db'

let EQUIV_DB = DB.get('equivDB', {});
// e.g. {'ABC-123': {sku:'SKU-001', descripcionXML:'REFRESCO COLA 600ML', asignadoEn:'2025-01-15'}}

function findEquiv(codigoXML, descripcion){
  // Exact code match first
  if(codigoXML && EQUIV_DB[codigoXML]) return EQUIV_DB[codigoXML].sku;
  // Try normalized description match
  const normDesc=(descripcion||'').toLowerCase().trim();
  const match=Object.entries(EQUIV_DB).find(([,v])=>
    v.descripcionXML&&v.descripcionXML.toLowerCase().trim()===normDesc
  );
  return match?match[1].sku:null;
}

function saveEquiv(codigoXML, descripcionXML, sku, tasa){
  if(!codigoXML&&!descripcionXML) return;
  const key=codigoXML||('DESC::'+descripcionXML.toLowerCase().trim());
  const existing=EQUIV_DB[key]||{};
  EQUIV_DB[key]={
    sku,
    descripcionXML,
    asignadoEn:ds(),
    tasa: tasa!==undefined ? tasa : existing.tasa
  };
  saveEquivDB();
}

  const entries=Object.entries(EQUIV_DB);

  // SKUs sin ninguna equivalencia
  const skusConEquiv=new Set(Object.values(EQUIV_DB).filter(v=>v.sku).map(v=>v.sku));

  const stats=`<div class="sr" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">

  // SKUs already assigned to OTHER equivalencias (current row's SKU stays available)
  const skusAsignados=new Set(Object.entries(EQUIV_DB).filter(([,v])=>v.sku).map(([,v])=>v.sku));

  const rows=entries.sort((a,b)=>b[1].asignadoEn?.localeCompare(a[1].asignadoEn||'')||0).map(([codigo,v],idx)=>{
    const p=PRODS.find(x=>x.sku===v.sku);

        :`<span class="badge ok">Exento</span>`;
    return `<tr>
      <td style="font-family:monospace;font-size:12px">${codigo.startsWith('DESC::')?'(por descripción)':codigo}</td>

      <tbody>${rows}</tbody>
    </table></div>`;
}

function saveEquivRow(idx, codigo){
  const sel=document.getElementById('eqsel-'+idx);
  if(!sel)return;
  const sku=sel.value;
  // Restriction: SKU already assigned to another key?
  if(sku){
    const existing=Object.entries(EQUIV_DB).find(([k,v])=>v.sku===sku&&k!==codigo);
    if(existing){
      const p=PRODS.find(x=>x.sku===sku);
      const keyLabel=existing[0].startsWith('DESC::')?existing[0].slice(6):existing[0];
      toast(`❌ ${p?.name||sku} ya está asignado a "${keyLabel}"`);
      return;
    }
  }
  if(EQUIV_DB[codigo]){
    EQUIV_DB[codigo].sku=sku;
    EQUIV_DB[codigo].asignadoEn=ds();
    saveEquivDB();
  }
  // Update badge inline
  const badge=document.getElementById('eqbadge-'+idx);
  const p=PRODS.find(x=>x.sku===sku);
  if(badge){
    badge.innerHTML=sku&&p
      ?`<span class="badge ok">&#10003; ${p.name}</span>`
      :sku
        ?`<span class="badge out">SKU no encontrado en catálogo</span>`
        :`<span class="badge low">Sin asignar</span>`;
  }
  addLog('equivalencias','Actualizado',`Equivalencia: ${codigo} → ${sku||'sin asignar'}`);
  toast(sku&&p?`✓ Guardado — ${p.name}`:'✓ Equivalencia actualizada');
}

function deleteEquivByKey(codigo){
  addLog('equivalencias','Eliminado',`Equivalencia eliminada: ${codigo}`);
  delete EQUIV_DB[codigo];

  rPage('equivalencias');

}

function updateEquiv(codigo, sku){
  if(!EQUIV_DB[codigo]) return;
  if(sku){
    const existing=Object.entries(EQUIV_DB).find(([k,v])=>v.sku===sku&&k!==codigo);
    if(existing){
      const p=PRODS.find(x=>x.sku===sku);
      toast(`❌ ${p?.name||sku} ya está asignado a otra equivalencia`);
      rPage('equivalencias');return;
    }
  }
  EQUIV_DB[codigo].sku=sku;
  EQUIV_DB[codigo].asignadoEn=ds();
  saveEquivDB();
  const p=PRODS.find(x=>x.sku===sku);
  toast(sku?(p?`Mapeado → ${p.name}`:'SKU asignado'):'Equivalencia sin SKU');
}

function deleteEquiv(codigo){

function saveManualEquiv(){
  const cod=document.getElementById('eq-cod')?.value.trim();
  const desc=document.getElementById('eq-desc')?.value.trim();
  const sku=document.getElementById('eq-sku')?.value;
  if(!cod&&!desc){toast('Ingresa el código o descripción del XML');return}
  if(!sku){toast('Selecciona un SKU de tu catálogo');return}
  // Restriction: SKU already assigned to another key?
  const dupSKU=Object.entries(EQUIV_DB).find(([,v])=>v.sku===sku);
  if(dupSKU){
    const keyLabel=dupSKU[0].startsWith('DESC::')?dupSKU[0].slice(6):dupSKU[0];
    const p=PRODS.find(x=>x.sku===sku);
    toast(`❌ ${p?.name||sku} ya está asignado a "${keyLabel}". Un SKU solo puede tener una equivalencia.`);
    return;
  }
  // Restriction: codigo/desc key already exists with a different SKU?
  const key=cod||('DESC::'+desc.toLowerCase().trim());
  if(EQUIV_DB[key]&&EQUIV_DB[key].sku&&EQUIV_DB[key].sku!==sku){
    toast(`❌ Este código/descripción ya está mapeado a otro SKU. Edítalo desde la tabla.`);
    return;
  }
  saveEquiv(cod,desc,sku);
  addLog('equivalencias','Nuevo registro',`Equivalencia: ${cod||desc} → ${sku}`);
  closeMod();rPage('equivalencias');
  const p=PRODS.find(x=>x.sku===sku);
  toast(`Equivalencia guardada → ${p?.name||sku}`);
}
